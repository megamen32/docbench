- id: evidence_5
  description: Green Cross hereby grants to MacroGenics a royalty-free, worldwide
    license during the Term, with the right to grant sublicenses, under the Green
    Cross Licensed Patents and Green Cross Know-how that is incorporated into any
    Product, and all other intellectual property Controlled by Green Cross that is
    specifically related to MGAH22 to the extent needed by MacroGenics to research,
    identify, develop, make, have made, use, sell, offer for sale and import Products,
    including, without limitation, as contemplated by Section 10.1(c) above, in all
    cases without any obligation to obtain Green Cross' prior consent. | royalty-free,
    license, with the right to grant sublicenses, during the Term to use all Clinical
    Data and other data generated by MacroGenics pursuant to its performing its responsibilities
    under this Agreement for Green Cross to fulfill its obligations under this Agreement
    | Green Cross may grant sublicensees solely for purposes of performing its Development
    obligations under this Agreement | Subject to the terms and conditions of this
    Agreement, MacroGenics hereby grants to Green Cross a non-exclusive, | Subject
    to the terms and conditions of this Agreement, Green Cross hereby grants to MacroGenics
    a non- exclusive, royalty-free, perpetual license, with the right to grant and
    authorize the grant of sublicenses, to use all Clinical Data and any data generated
    by Green Cross or any of its representatives or independent contractors pursuant
    to its performing its responsibilities under this Agreement for the research,
    Development, manufacture Commercialization and sales of MGAH22 and Products by
    MacroGenics outside the Territory and for MacroGenics to exercise its rights and
    fulfill its obligations under this Agreement. | Subject to the terms and conditions
    of this Agreement, MacroGenics hereby grants to Green Cross an exclusive, royalty-
    bearing (i) license, with the right to grant sublicenses (subject to Section 10.1(b)),
    under the MacroGenics Licensed Technology and the MacroGenics Licensed Trademarks;
    and (ii) to the extent needed under this Section 10.1(a), sublicense under the
    MacroGenics Licensed Technology licensed pursuant to the Upstream Agreements,
    in the case of each of (i) and (ii), to conduct the Phase I Clinical Development
    Plan and Phase II Clinical Development Plan, and to distribute, sell, offer for
    sale and import Products in the Field in the Territory during the Term.
  severity: major
  category: contract_clause
