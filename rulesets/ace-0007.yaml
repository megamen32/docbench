    publicly perform, publicly display, electronically transmit, distribute and broadcast
    the Programming; (c) promote the Programming and use IMNTV Marks for Distributor''s
    promotion of the Programming as activities described in Section 2.4 above; (d)
    archive the Programming on Distributor''s servers; (e) encode, copy, and create
    continuous Programming excerpts of up to sixty (60) seconds and transmit, publicly
    perform, distribute, and redistribute such excerpts to'
