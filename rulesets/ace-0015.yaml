id: ace-0015
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_5
  description: For greater certainty, "New Technology" shall exclude any (x) modification
    to Philips pre-existing Intellectual Property Rights (which, shall exclude any
    Intellectual Property Rights forming part of the "Purchased Assets" under the
    Purchase Agreement) and (y) developments developed not for the Products (collectively,
    "Philips Retained Product IP'), provided that Philips and its Affiliates hereby
    grant to Customer under any such Intellectual Property Rights, which are applicable
    or used for the manufacturing of the Product, a non- exclusive, non-transferable
    (except in accordance with clause 18.4 (Assignment)), irrevocable, world-wide,
    fully paid-up license, without the right to grant sub-licenses, to make, have
    made, sell or commercialize in any other way the Product. | Customer grants to
    Philips, during the Term, a non-exclusive, royalty-free, non-transferrable right
    to make, have made, use, sell, reproduce, adapt, distribute, or otherwise use
    or practice Customer's Intellectual Property Rights solely in connection with
    manufacturing of the Products and packaging to Customer pursuant to this Agreement.
  severity: major
  category: contract_clause
