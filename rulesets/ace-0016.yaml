- id: evidence_15
  description: 'Such notice shall include written confirmation and details of replacement
    insurance coverages and other material revisions to the policies, which shall
    be effective immediately upon any cancellation or material change in EFS'' policies
    in order that no gap in coverage results. | EFS agrees that these policies shall
    not be canceled or materially changed without at least thirty (30) days'' prior
    written notice to Client. | EFS shall maintain at all times during the Term of
    this Agreement insurance as provided below and shall name Client, its parent company,
    subsidiaries and affiliated entities and their respective officers, directors,
    shareholders, agents and employees as additional insureds to the extent of indemnity
    provided herein under its liability policies as follows: (i) Commercial general
    liability insurance including premises/operations, broad form property damage,
    independent contractors, and contractual liability covering EFS'' obligations
    hereunder for bodily injury and property damage, with a combined single limit
    of not less than $1,000,000 each occurrence and $6,000,000 umbrella coverage;
    (ii) Workers'' compensation insurance in statutory amounts covering EFS and its
    employees; and (iii) Errors and omissions insurance, and employer''s liability
    insurance in an amount not less than $1,000,000 per accident/disease. | of no
    less than A-. | All insurance required above shall be carried with insurance companies
    licensed to do business in the state(s) where operations are maintained with a
    rating | EFS shall deliver to Client, upon execution of the Agreement, certificates
    of insurance as evidence of the required coverages.'
  severity: major
  category: contract_clause
