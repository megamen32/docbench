institution: ACE (Fujitsu)
rules:
- id: evidence_10
  description: Client hereby grants to EFS a limited and perpetual right and license
    to use such photographs and materials for research and forecasting purposes, including,
    but not limited to, combining the same with reports and analytics concerning the
    performance of the Websites, providing information to strategic partners to better
    define consumer purchasing habits, and for trend forecasting and planning purposes.
    | Business. | Client holds certain customer data relating to the Playboy Commerce
    Business ("Existing Customer Data") and hereby grants to EFS a non-exclusive,
    limited, non-sublicensable, non-transferable, revocable license to store and use
    such Existing Customer Data solely for purposes of the operation and promotion
    of the Playboy Commerce | All Derivative Works are hereby licensed back to EFS
    subject to the limitations that are applicable hereunder to the Playboy Content.
    | During the Term and subject to the terms, conditions, and limitations set forth
    in this Agreement, Client grants EFS a limited, non-exclusive, non-transferable,
    non-assignable (without any right to sublicense), world-wide license to use the
    Client trademarks and/or service marks as set forth on Part A of Exhibit 1 (the
    "Playboy Marks") solely in connection with the design, publication, distribution,
    operation and promotion of the Playboy Commerce Business. | All such photographs
    shall be deemed Playboy Content for purposes of this Agreement, for which EFS
    shall have a license to use during the Term solely in connection with the Playboy
    Commerce Business and as is necessary to promote the Websites. | During the Term
    and subject to the terms, conditions, and limitations set forth in this Agreement,
    Client grants EFS a limited, non-exclusive, non-transferable, non-assignable (without
    any right to sublicense), world-wide license to use, modify, create derivative
    works of, publish, reproduce, broadcast, exhibit and display the Playboy Content
    solely in connection with the design, publication, distribution, operation and
    promotion of the Playboy Commerce Business. | During the Term and subject to the
    terms, conditions and limitations of this Agreement, Client hereby grants EFS,
    a limited, non-transferable, non-assignable (without any right to sublicense)
    world-wide license to use the Internet location or resource designators (URLs,
    domain names, etc.) set forth in Part B of Exhibit 1 hereto, and/or to the extent
    approved in advance in writing by Client, as the case may be, modifications thereof
    (the "Licensed Domain Names"), as the domain name(s) and Internet locators/designators
    for the Websites during the Term.
  severity: major
  category: contract_clause
