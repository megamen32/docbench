    base_url_env: DOCBENCH_GIGACHAT_BASE_URL
    base_url_default: https://api.giga.chat/v1
    # The user currently keeps the authorization key in SBER. It is used only
    # to obtain an in-memory, 30-minute OAuth access token.
    api_key_env: SBER
    auth_method: gigachat_oauth
    oauth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
    oauth_scope: GIGACHAT_API_PERS
    ca_bundle_env: DOCBENCH_GIGACHAT_CA_BUNDLE
