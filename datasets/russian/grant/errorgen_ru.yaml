# План errorgen для пакета seed-grant.
# Только мутации — эталонные ожидания пересчитываются детерминированным
# оракулом во время загрузки, поэтому внедрённые дефекты и ожидания никогда не разойдутся.
source: valid_full.yaml
ops:
  - id: corr_missing_budget
    op: remove_document
    params: {doc_id: budget}
    note: отсутствует обязательный документ (также нарушает согласованность формы и сметы)
  - id: corr_missing_registration
    op: remove_document
    params: {doc_id: registration_cert}
    note: отсутствует выписка из реестра
  - id: corr_over_budget
    op: scale_number
    params: {paths: [budget.totals.total, "budget.row.*.amount_eur"], factor: 1.6}
    note: итог превышает порог в 100 тыс. евро; доли остаются корректными
  - id: corr_equipment_heavy
    op: set_field
    params: {path: budget.row.equipment.share_pct, value: 55.5}
    note: доля статьи «Оборудование» превышает предел в 40 процентов
  - id: corr_late_submission
    op: shift_date
    params: {path: application_form.submission_date, days: 45}
    note: заявка подана после истечения срока приёма
  - id: corr_unsigned
    op: drop_signature
    params: {path: application_form.signature_present}
    note: отсутствует подпись уполномоченного лица
  - id: corr_unregistered
    op: set_field
    params: {path: application_form.months_registered, value: 3}
    note: организация существует слишком короткий срок для основного трека
  - id: corr_sum_mismatch
    op: set_field
    params:
      path: application_form.requested_total_eur
      value: {copy_from: budget.totals.total, delta: 5000}
    note: сумма в форме заявки не совпадает с итогом сметы
  - id: corr_wrong_period
    op: set_field
    params: {path: finance_statement.period, value: FY2024}
    note: финансовый отчёт за неверный отчётный период
