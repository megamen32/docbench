id: policy_grant_2026
benchmark: rule_extraction
notes: "Русский seed-кейс: формальные правила приёма заявок фонда; gold соответствует rulesets/seed-grant-2026.1."
canonical_fields:
  - application_form.months_registered
  - budget.totals.total
  - budget.row.equipment.share_pct
  - documents.application_form.present
  - documents.budget.present
  - documents.registration_cert.present
  - documents.finance_statement.present
  - application_form.submission_date
  - application_form.signature_present
  - application_form.requested_total_eur
  - finance_statement.period
policy_document: |
  ФОНД «ПРИМЕР» — ГРАНТОВАЯ ПРОГРАММА 2026
  Формальные правила приёма, версия 2026.1 (каноническая).

  1. Допуск. На дату подачи организация-заявитель должна быть зарегистрирована
  не менее 12 месяцев. Это жёсткий критерий: заявки более молодых организаций
  отклоняются автоматически.

  2. Лимит бюджета. Запрашиваемая сумма не может превышать 100 000 евро.
  Превышающие лимит заявки возвращаются на доработку.

  3. Доля оборудования. Расходы на оборудование не могут превышать 40% общего бюджета.

  4. Обязательные документы. Полный пакет включает: (а) форму заявки;
  (б) детализированный бюджет; (в) свидетельство о регистрации, то есть выписку
  из реестра; (г) последнюю финансовую отчётность. Пакет без любого из этих
  документов не принимается и отклоняется.

  5. Срок. Заявки принимаются до 1 октября 2026 года включительно. Поздние
  заявки возвращаются.

  6. Подпись. Форму заявки подписывает законный представитель. Неподписанные
  формы отклоняются.

  7. Согласованность. Запрашенная в форме сумма должна точно совпадать с итогом
  детализированного бюджета.

  8. Отчётный период. Финансовая отчётность должна охватывать FY2025.
  Отчётность за другой период — формальный недостаток.
expected_rules:
  - id: R001
    description: Организация зарегистрирована не менее 12 месяцев на дату подачи
    severity: critical
    category: eligibility
    condition: {field: application_form.months_registered, op: ge, value: 12}
  - id: R002
    description: Запрашиваемый бюджет не превышает 100000 евро
    severity: major
    category: budget
    condition: {field: budget.totals.total, op: le, value: 100000}
  - id: R003
    description: Доля оборудования не превышает 40 процентов бюджета
    severity: major
    category: budget
    condition: {field: budget.row.equipment.share_pct, op: le, value: 40}
  - id: R004
    description: Обязательна форма заявки
    severity: critical
    category: required_documents
    condition: {field: documents.application_form.present, op: exists}
  - id: R005
    description: Обязателен детализированный бюджет
    severity: critical
    category: required_documents
    condition: {field: documents.budget.present, op: exists}
  - id: R006
    description: Обязательна выписка из реестра
    severity: critical
    category: required_documents
    condition: {field: documents.registration_cert.present, op: exists}
  - id: R007
    description: Обязательна последняя финансовая отчётность
    severity: critical
    category: required_documents
    condition: {field: documents.finance_statement.present, op: exists}
  - id: R008
    description: Заявки принимаются до 2026-10-01 включительно
    severity: major
    category: deadlines
    condition: {field: application_form.submission_date, op: le, value: "2026-10-01"}
  - id: R009
    description: Форма заявки подписана законным представителем
    severity: critical
    category: formal
    condition: {field: application_form.signature_present, op: eq, value: true}
  - id: R010
    description: Сумма в форме совпадает с итогом бюджета
    severity: major
    category: consistency
    condition: {op: consistent, fields: [application_form.requested_total_eur, budget.totals.total]}
  - id: R011
    description: Финансовая отчётность охватывает период FY2025
    severity: minor
    category: reporting
    condition: {field: finance_statement.period, op: eq, value: "FY2025"}
