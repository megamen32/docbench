id: ace-0020
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_5
  description: |
    Green Cross настоящим предоставляет MacroGenics безвозмездную, всемирную
    лицензию на Срок с правом выдачи сублицензий в рамках Лицензированных Патентов
    Green Cross и Ноу-хау Green Cross, включённых в любой Продукт, а также
    всей иной интеллектуальной собственности, контролируемой Green Cross, непосредственно
    относящейся к MGAH22, в объёме, необходимом MacroGenics для исследования,
    идентификации, разработки, производства, организации производства, использования,
    продажи, предложения к продаже и импорта Продуктов, включая, без ограничения
    указанным, как предусмотрено пунктом 10.1(с) выше, во всех случаях без
    какой-либо обязанности получать предварительное согласие Green Cross. | безвозмездную
    лицензию с правом выдачи сублицензий на Срок на использование всех Клинических
    Данных и иных данных, сгенерированных MacroGenics в соответствии с исполнением
    ею своих обязанностей по настоящему Соглашению, в целях исполнения Green
    Cross своих обязанностей по настоящему Соглашению. | Green Cross вправе
    предоставлять сублицензиатам лицензии исключительно в целях исполнения своих
    обязательств по Разработке по настоящему Соглашению. | В соответствии с
    условиями настоящего Соглашения MacroGenics настоящим предоставляет Green
    Cross неисключительную, [нркб] безвозмездную, бессрочную лицензию с правом
    выдачи и разрешения выдачи сублицензий на использование всех Клинических
    Данных и любых данных, сгенерированных Green Cross или любым из её представителей
    или независимых подрядчиков в соответствии с исполнением ею своих обязанностей
    по настоящему Соглашению, для исследования, Разработки, производства, Коммерциализации
    и продаж MGAH22 и Продуктов MacroGenics за пределами Территории, а также
    для осуществления MacroGenics своих прав и исполнения своих обязанностей
    по настоящему Соглашению. | В соответствии с условиями настоящего Соглашения
    MacroGenics настоящим предоставляет Green Cross исключительную, [нркб]
    возмездную роялти (i) лицензию с правом выдачи сублицензий (с учётом пункта
    10.1(b)) в рамках Лицензированной Технологии MacroGenics и Лицензированных
    Товарных Знаков MacroGenics; и (ii) в объёме, необходимом по настоящему
    пункту 10.1(a), сублицензию в рамках Лицензированной Технологии MacroGenics,
    лицензированной в соответствии с Восходящими Соглашениями, в каждом из
    случаев (i) и (ii) — для выполнения Плана Клинической Разработки Фазы I
    и Плана Клинической Разработки Фазы II, а также для распространения, продажи,
    предложения к продаже и импорта Продуктов в Области применения и на Территории
    в течение Срока.
  severity: major
  category: contract_clause
- id: evidence_6
  description: |
    Если Green Cross расторгает настоящее Соглашение в соответствии с
    пунктом 16.3: | (ii) Несмотря на любые противоречащие положения, MacroGenics
    обязуется продолжать предоставлять Green Cross, на срок до ***, Продукты
    (включая, без ограничения, весь MGAH22), по запросу Green Cross в соответствии
    с условиями пункта 6.2.
  severity: major
  category: contract_clause
