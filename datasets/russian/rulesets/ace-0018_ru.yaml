id: ace-0018
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_4
  description: привлекать любых Клиентов, имеющих коммерческое присутствие за пределами
    Территории, за исключением того, что Дистрибьютор не вправе осуществлять
    деятельность по привлечению на любой внешней территории, где Hydraspin связана
    эксклюзивным дистрибьюторским соглашением с третьим лицом, при условии, что
    Hydraspin уведомила Дистрибьютора в письменной форме о своих договорённостях
    с другим дистрибьютором и о территории, в отношении которой действует исключительное
    право в пользу другого дистрибьютора. | Дистрибьютор вправе рекламировать,
    продвигать, маркетировать или
  severity: major
  category: contract_clause
