id: ace-0003
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_6
  description: В тех странах, где для совместного правообладателя Совместного изобретения
    или Совместного улучшения требуется специальная лицензия для использования
    такого Совместного изобретения или Совместного улучшения, в такой стране
    каждая Сторона настоящим предоставляет другой Стороне бессрочную, безотзывную,
    неисключительную, всемирную, безвозмездную, полностью оплаченную лицензию,
    передаваемую и сублицензируемую, в пределах прав, правовых оснований и интересов
    такой Стороны в отношении такого Совместного изобретения или Совместного
    улучшения, на свободное использование такого Совместного изобретения или
    Совместного улучшения в такой стране в соответствии с условиями настоящего
    Соглашения и предоставленными по нему лицензиями. | В отношениях между Сторонами
    Стороны совместно владеют всеми Изобретениями (включая Улучшения), разработанными,
    созданными или реализованными совместно или от имени обеих Сторон (такие
    Изобретения — Совместные изобретения, и такие Улучшения — Совместные улучшения),
    а также всеми Правами интеллектуальной собственности и Ноу-хау в них.
    | Каждая Сторона настоящим уступает другой Стороне равную и неделимую долю
    во всех Совместных изобретениях (включая Совместные улучшения) для оформления
    такого совместного владения такими Совместными изобретениями (включая Совместные
    улучшения).
  severity: major
  category: contract_clause
