id: ace-0010
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_10
  description: По истечении срока действия либо прекращении либо Договора аренды,
    либо Франчайзингового договора (прилагается), Арендодатель будет сотрудничать
    с Франчайзером и оказывать ему содействие в получении владения Помещением,
    и если Франчайзер не пожелает принять на себя права Арендатора, Арендодатель
    разрешит Франчайзеру войти в Помещение, не считаясь нарушителем владения
    и не неся какой-либо ответственности перед Арендодателем, чтобы убрать все
    вывески, навесы и другие элементы, идентифицирующие Помещение как Франчайзинговый
    Бизнес, а также произвести другие модификации (такие как перекраска), которые
    разумно необходимы для защиты Знаков The Joint и Системы, а также для
    отличия Помещения от Франчайзингового Бизнеса. | По прекращении или истечении
    срока действия Франшизы мы будем иметь право, но не обязанность, реализуемое
    в течение тридцати (30) дней путём письменного уведомления Вас, приобрести
    по справедливой рыночной стоимости все активы Франчайзингового Бизнеса,
    включая всё одобренное оборудование, оснастку, мебель и вывески, а также
    все материалы, сырьё и другие предметы, маркированные каким-либо Знаком,
    и принять на себя права по договору аренды Помещения и любому другому
    договору аренды или концессионному договору, необходимому для ведения Франчайзингового
    Бизнеса.
  severity: major
  category: contract_clause
