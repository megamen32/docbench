id: ace-0026
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_4
  description: |
    обязательства передающей Стороны в письменном инструменте, копия которого
    предоставляется другой Стороне; и (ii) любая уступка настоящего Соглашения
    должна сопровождаться одновременной уступкой Иных Соглашений тому же правопреемнику,
    а также интереса передающей Стороны в Приобретённых Активах тому же правопреемнику,
    если только Conformis заранее не согласится на иное, и такое согласие не
    может быть неразумно задержано. | За исключением случаев, предусмотренных
    настоящим Соглашением, ни одна из Сторон не вправе уступать какие-либо свои
    права или обязанности по настоящему Соглашению (путём слияния, продажи акций
    или иным образом) без предварительного письменного согласия другой Стороны;
    однако, любой из Сторон разрешается без необходимости получения согласия
    другой Стороны уступить настоящее Соглашение: (a) полностью или частично
    Аффилированному лицу (при условии, что после того как такое лицо перестаёт
    быть Аффилированным лицом передающей Стороны, такое бывшее Аффилированное
    лицо обязуется обратно уступить настоящее Соглашение передающей Стороне),
    при условии, что передающая Сторона уведомляет другую Сторону о любой такой
    уступке, и при этом, далее, если уведомление о такой уступке не предоставлено,
    это не делает такую уступку недействительной; либо (b) Третьему Лицу в
    связи с продажей или передачей всех или почти всех активов передающей Стороны,
    относящихся к предмету настоящего Соглашения, вне зависимости от того,
    происходит ли это путём Смены Контроля, слияния, продажи активов или иным
    образом; при условии, однако, что в отношении пункта (b): (i) любая уступка
    настоящего Соглашения является ничтожной и не имеет силы до тех пор, пока
    и если только правопреемник не примет на себя
  severity: major
  category: contract_clause
- id: evidence_5
  description: |
    передающей Стороны в письменном инструменте, копия которого предоставляется
    другой Стороне; и (ii) любая уступка настоящего Соглашения должна сопровождаться
    одновременной уступкой Иных Соглашений тому же правопреемнику, а также интереса
    передающей Стороны в Приобретённых Активах тому же правопреемнику, если только
    Conformis заранее не согласится на иное, и такое согласие не может быть
    неразумно задержано. | Любая уступка, не соответствующая настоящему пункту
    10.2, является ничтожной. | В той мере, в которой сотрудничество с Агентами
    или иными Третьими Лицами допускается в соответствии с Планом НИОКР, если
    какой-либо Стороне необходимо привлечь Агента или иное Третье Лицо в связи
    с Планом НИОКР или любой иной работой по настоящему Соглашению, такая Сторона
    обязана заранее получить от этого Агента или иного Третьего Лица письменное
    согласие: (i) на передачу Стороне всех Изобретений, задуманных, созданных
    или разработанных Агентом или иным Третьим Лицом, и (ii) на сохранение всей
    Конфиденциальной Информации в тайне, как предусмотрено пунктом 5.2. | За
    исключением случаев, предусмотренных настоящим Соглашением, ни одна из Сторон
    не вправе уступать какие-либо свои права или обязанности по настоящему
    Соглашению (путём слияния, продажи акций или иным образом) без предварительного
    письменного согласия другой Стороны; однако, любой из Сторон разрешается
    без необходимости получения согласия другой Стороны уступить настоящее
    Соглашение: (a) полностью или частично Аффилированному лицу (при условии,
    что после того как такое лицо перестаёт быть Аффилированным лицом передающей
    Стороны, такое бывшее Аффилированное лицо обязуется обратно уступить настоящее
    Соглашение передающей Стороне), при условии, что передающая Сторона уведомляет
    другую Сторону о любой такой уступке, и при этом, далее, если уведомление
    о такой уступке не предоставлено, это не делает такую уступку недействительной;
    либо (b) Третьему Лицу в связи с продажей или передачей всех или почти
    всех активов передающей Стороны, относящихся к предмету настоящего Соглашения,
    вне зависимости от того, происходит ли это путём Смены Контроля, слияния,
    продажи активов или иным образом; при условии, однако, что в отношении
    пункта (b): (i) любая уступка настоящего Соглашения является ничтожной
    и не имеет силы до тех пор, пока и если только правопреемник не примет
    на себя
  severity: major
  category: contract_clause
