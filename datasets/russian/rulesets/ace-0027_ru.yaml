id: ace-0027
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_4
  description: |
    Если после даты настоящего Соглашения и до тех пор, пока любая из Сторон
    является партнёром, участником или акционером Операционной Компании, Совместное
    Предприятие разработает или завершит разработку, либо обнаружит, либо
    приобретёт имущественные права на процесс или продукт, который на момент
    или после момента его разработки, обнаружения или приобретения имеет или
    может иметь какое-либо применение за пределами Области Соглашения, то
    соответствующее юридическое лицо Совместного Предприятия обязано предложить
    лицензию на использование такого процесса или продукта (или их производства)
    для такого применения каждой из Сторон на разумных коммерческих условиях
    (включая, без ограничения, возможную уплату роялти по рыночным ставкам),
    принимая во внимание время и средства, затраченные Совместным Предприятием,
    и с учётом других значимых коммерческих факторов. | Если любая из Сторон
    получила Предложение Третьего Лица, которое она намерена принять (далее —
    «Предложение»), такая Сторона (далее — «Сторона-Продавец») обязуется уведомить
    другую Сторону (далее — «Сторона-Рецепиент») о Предложении, причём такое
    уведомление должно включать копию Предложения и любую иную информацию,
    необходимую для того, чтобы Сторона-Рецепиент могла разумно оценить Предложение
    и потенциального покупателя. | Если после даты настоящего Соглашения и до
    тех пор, пока любая из Сторон является партнёром, участником или акционером
    Операционной Компании, такая Сторона или любое её Аффилированное лицо получит
    или обнаружит возможность использования Астаксантина в качестве Нутрицевтика
    (далее — «Возможность в сфере Нутрицевтики»), включая, без ограничения,
    разработку или завершение разработки, обнаружение или приобретение имущественных
    прав на продукт или процесс, связанный с использованием Астаксантина
    в качестве Нутрицевтика, такая Сторона обязуется (или обязуется обеспечить,
    чтобы её Аффилированное лицо) представить такую возможность Операционной
    Компании, предоставив Операционной Компании такое нарративное описание
    и бюджетную и иную информацию, которую такая Сторона (или её Аффилированные
    лица) могли подготовить или собрать в объёме, необходимом для оценки такой
    Возможности в сфере Нутрицевтики. | Сторона-Рецепиент имеет тридцать (30)
    дней с даты получения уведомления от Стороны-Продавца (далее — «Опционный
    Период»), чтобы выбрать одно из: (i) приобрести долю Стороны-Продавца в
    Операционной Компании либо (ii) продать свою долю в Операционной Компании
    Стороне-Продавцу, в любом случае на тех же условиях, которые содержатся
    в Предложении.
  severity: major
  category: contract_clause
