  severity: major
  category: contract_clause
- id: evidence_15
  description: |
    Такое уведомление должно включать письменное подтверждение и сведения
    о заменяющих страховых покрытиях и другие существенные изменения в полисах,
    которые вступают в силу немедленно при любой отмене или существенном изменении
    полисов EFS, чтобы не возникало пробелов в покрытии. | EFS соглашается, что
    эти полисы не будут отменены или существенно изменены без предварительного
    письменного уведомления Клиента не менее чем за тридцать (30) дней. | EFS
    обязуется в течение всего Срока действия настоящего Соглашения поддерживать
    страхование, как указано ниже, и указывать Клиента, его материнскую компанию,
    дочерние общества и аффилированные лица, а также соответствующих должностных
    лиц, директоров, акционеров, агентов и работников в качестве дополнительных
    застрахованных лиц в объёме возмещения, предусмотренного настоящим Соглашением,
    в соответствии со своими полисами ответственности следующим образом: (i)
    коммерческое страхование общей ответственности, включая ответственность
    за помещения/операции, страхование имущества по расширенной форме, ответственность
    независимых подрядчиков и договорную ответственность, покрывающую обязательства
    EFS по настоящему Соглашению в связи с телесными повреждениями и ущербом
    имуществу, с совокупным единым лимитом не менее 1 000 000 долларов США на
    каждый случай и зонтичным покрытием в размере 6 000 000 долларов США; (ii)
    страхование работников от несчастных случаев на производстве в установленных
    законом суммах, покрывающее EFS и её работников; и (iii) страхование от
    ошибок и упущений, а также страхование ответственности работодателя в размере
    не менее 1 000 000 долларов США на каждый несчастный случай/заболевание.
    | не ниже A-. | Всё требуемое выше страхование должно осуществляться страховыми
    компаниями, имеющими право вести деятельность в штате (штатах), где осуществляются
    операции, с рейтингом | EFS обязуется передать Клиенту при подписании Соглашения
    страховые сертификаты в качестве доказательства требуемого покрытия.
  severity: major
  category: contract_clause
