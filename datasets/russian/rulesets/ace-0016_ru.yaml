id: ace-0016
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_10
  description: |
    Клиент настоящим предоставляет EFS ограниченное и бессрочное право
    и лицензию на использование таких фотографий и материалов в целях исследования
    и прогнозирования, включая, но не ограничиваясь, объединение их с отчётами
    и аналитикой, относящимися к работе Веб-сайтов, предоставление информации
    стратегическим партнёрам для лучшего определения потребительских привычек
    и для целей прогнозирования трендов и планирования. | Бизнес. | Клиент владеет
    определёнными данными клиентов, относящимися к Бизнесу электронной коммерции
    Playboy (далее — «Существующие Данные Клиентов»), и настоящим предоставляет
    EFS неисключительную, ограниченную, не подлежащую сублицензированию, непередаваемую,
    отзывную лицензию на хранение и использование таких Существующих Данных
    Клиентов исключительно в целях ведения и продвижения Бизнеса электронной
    коммерции Playboy. | Все Производные Произведения настоящим лицензируются
    обратно EFS с учётом ограничений, применимых по настоящему Соглашению к
    Контенту Playboy. | В течение Срока и в соответствии с условиями и ограничениями,
    изложенными в настоящем Соглашении, Клиент предоставляет EFS ограниченную,
    неисключительную, непередаваемую, не подлежащую уступке (без права сублицензирования),
    всемирную лицензию на использование товарных знаков и/или знаков обслуживания
    Клиента, указанных в Части A Приложения 1 (далее — «Знаки Playboy»), исключительно
    в связи с разработкой, публикацией, распространением, ведением и продвижением
    Бизнеса электронной коммерции Playboy. | Все такие фотографии считаются
    Контентом Playboy для целей настоящего Соглашения, в отношении которого EFS
    имеет лицензию на использование в течение Срока исключительно в связи
    с Бизнесом электронной коммерции Playboy и по мере необходимости для продвижения
    Веб-сайтов. | В течение Срока и в соответствии с условиями и ограничениями,
    изложенными в настоящем Соглашении, Клиент предоставляет EFS ограниченную,
    неисключительную, непередаваемую, не подлежащую уступке (без права сублицензирования),
    всемирную лицензию на использование, изменение, создание производных произведений,
    публикацию, воспроизведение, трансляцию, демонстрацию и показ Контента Playboy
    исключительно в связи с разработкой, публикацией, распространением, ведением
    и продвижением Бизнеса электронной коммерции Playboy. | В течение Срока
    и в соответствии с условиями и ограничениями настоящего Соглашения Клиент
    настоящим предоставляет EFS ограниченную, непередаваемую, не подлежащую
    уступке (без права сублицензирования) всемирную лицензию на использование
    идентификаторов интернет-ресурсов (URL, доменные имена и т. д.), указанных
    в Части B Приложения 1 к настоящему Соглашению, и/или, в той мере, в какой
    это заранее одобрено Клиентом в письменной форме, в зависимости от обстоятельств,
    их модификаций (далее — «Лицензированные Доменные Имена»), в качестве доменного
    имени (имён) и интернет-идентификаторов для Веб-сайтов в течение Срока.
  severity: major
  category: contract_clause
