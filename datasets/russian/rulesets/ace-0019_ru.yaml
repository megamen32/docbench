id: ace-0019
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_7
  description: Не ограничивая какие-либо обязательства или ответственность Подрядчика,
    вытекающие из настоящего Соглашения или из закона, с учётом любых ограничений
    по настоящему Соглашению, Подрядчик обязан поддерживать, а также обязывать
    любых привлечённых им субподрядчиков, оказывающих услуги по настоящему
    Соглашению, поддерживать за свой счёт в течение срока действия настоящего
    Соглашения страховые полисы видов и в пределах, указанных в ПРИЛОЖЕНИИ D
    к настоящему Соглашению. Расходы по такому страхованию несёт Подрядчик.
    Подрядчик обязан поддерживать в силе полисы, указанные в разделах 1 и 3
    Страхового Сертификата, до тех пор, пока юридическая ответственность Подрядчика
    СУЩЕСТВУЕТ В СВЯЗИ С ОПЕРАЦИЯМИ ПО НАСТОЯЩЕМУ СОГЛАШЕНИЮ.
  severity: major
  category: contract_clause
