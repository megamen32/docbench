version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_5
  description: |
    На Срок Лицензии и в пределах Лицензионной Территории Продюсер настоящим
    предоставляет ConvergTV право и лицензию на Распространение программы, файла
    или видеозаписи, указанных в Условиях Сделки выше (далее — «Программа»),
    состоящей из | эпизодов (серий) или | Срок Лицензии — Бессрочный, неограниченное
    количество показов × Иное: 2 года, начиная с 15 ноября 2012 года | Продюсер
    также предоставляет ConvergTV право и лицензию на Распространение Программы
    на любом канале ConvergTV и/или на любых иных каналах распространения, существующих
    в настоящий момент или созданных или разработанных в будущем, и это право
    включает право на Распространение на любых каналах аффилированного лица ConvergTV
    и/или на любых иных каналах распространения без ограничений. | Разовые произведения,
    на неограниченное количество показов в течение Срока Лицензии через каналы
    ConvergTV и/или иные каналы распространения, в соответствии с Лицензионными
    Правами.
  severity: major
  category: contract_clause
