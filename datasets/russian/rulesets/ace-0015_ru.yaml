id: ace-0015
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_5
  description: |
    Для большей определённости, «Новая Технология» не включает любое:
    (x) изменение предсуществующих Прав интеллектуальной собственности Philips
    (которые, в свою очередь, исключают любые Права интеллектуальной собственности,
    входящие в «Приобретённые Активы» по Договору купли-продажи), и (y) разработки,
    выполненные не для Продуктов (совместно именуемые «Сохраняемая Интеллектуальная
    Собственность Philips на Продукт»), при условии, что Philips и её Аффилированные
    лица настоящим предоставляют Заказчику в рамках любых таких Прав интеллектуальной
    собственности, применимых или используемых для производства Продукта,
    неисключительную, непередаваемую (за исключением случаев, предусмотренных
    пунктом 18.4 (Уступка)), безотзывную, всемирную, полностью оплаченную лицензию
    без права выдачи сублицензий на производство, организацию производства,
    продажу или иную коммерциализацию Продукта. | Заказчик предоставляет Philips
    в течение Срока неисключительное, безвозмездное, непередаваемое право на
    производство, организацию производства, использование, продажу, воспроизведение,
    адаптацию, распространение или иное использование Прав интеллектуальной
    собственности Заказчика исключительно в связи с производством Продуктов
    и упаковки для Заказчика в соответствии с настоящим Соглашением.
  severity: major
  category: contract_clause
