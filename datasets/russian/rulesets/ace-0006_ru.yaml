id: ace-0006
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_12
  description: 2. Термин «Оценочный Материал» не включает какую-либо информацию,
    которая | (ii) была или стала доступна Вам на неконфиденциальной основе
    от лица (иного, нежели Компания или её Представители), которое, насколько
    Вам известно, не связано иным соглашением о конфиденциальности с Компанией
    или её Представителями, или не лишено права передавать Вам такую информацию
    в силу закона, договорного обязательства, фидуциарной обязанности или иным
    образом.
  severity: major
  category: contract_clause
- id: evidence_7
  description: Независимо от вышеизложенного, | (i) Вы и Ваши Представители не
    обязаны удалять, стирать или уничтожать какой-либо Оценочный Материал,
    содержащийся в архивной системе автоматического резервного копирования,
    хранящейся в результате автоматических процедур резервного копирования
    (при этом Вы и Ваши Представители не будете получать доступ к таким архивным
    компьютерным файлам, содержащим такой Оценочный Материал, после того как
    такая передача или уничтожение иным образом требуется), и | (ii) Вы и/или
    Ваши Представители вправе сохранить одну копию Оценочного Материала (и
    можете получать доступ к такому Оценочному Материалу) в той мере и в течение
    того времени, в котором такое сохранение и доступ со стороны Вас или такого
    Представителя, в зависимости от обстоятельств, требуются в силу закона
    или нормативного акта; при условии, однако, что в случае каждого из пунктов
    | (i) и | (ii) настоящего предложения, независимо от любого иного положения
    настоящего Соглашения, Вы и соответствующие Ваши Представители продолжаете
    оставаться связанными условиями настоящего Соглашения, как если бы оно
    действовало в полную силу в отношении любого такого Оценочного Материала,
    до тех пор пока Вы или Ваши соответствующие Представители сохраняют любой
    такой Оценочный Материал.
  severity: major
  category: contract_clause
