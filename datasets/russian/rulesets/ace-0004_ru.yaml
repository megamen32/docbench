rules:
- id: evidence_9
  description: В соответствии с условиями настоящего Соглашения Поставщик Приложения
    настоящим предоставляет Excite@Home безвозмездную, неисключительную, всемирную
    лицензию на использование, воспроизведение, распространение, передачу и
    публичный показ Контента e-centives в соответствии с настоящим Соглашением,
    а также на сублицензирование Контента Приложения полностью принадлежащим
    Excite@Home дочерним компаниям или совместным предприятиям, в которых Excite@Home
    участвует, исключительно в целях использования, воспроизведения, распространения,
    передачи и публичного показа Контента e-centives в соответствии с настоящим
    Соглашением, при условии, что такое сублицензирование не осуществляется в
    пользу Указанных конкурентов Поставщика Приложения. | Каждая сторона настоящим
    предоставляет другой стороне неисключительную, ограниченную лицензию на
    использование своих товарных знаков, знаков обслуживания или торговых наименований
    исключительно в порядке, конкретно описанном в настоящем Соглашении.
  severity: major
  category: contract_clause
