id: ace-0022
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_4
  description: ExxonMobil вправе расторгнуть настоящее Соглашение с уведомлением
    за пятнадцать (15) дней в письменной форме без применения штрафов, платежей
    или ущемления прав на заявленные требования и обязательства, в случае
    если FCE подвергается Смене Контроля. | С учётом требований применимого
    законодательства, FCE обязуется уведомить ExxonMobil до или незамедлительно
    после того, как ей станет известно о любой такой Смене Контроля, а если
    предварительное уведомление запрещено применимым законодательством — как
    можно скорее или после того, как такое уведомление перестанет быть запрещённым,
    но в любом случае не позднее одного (1) рабочего дня после любого публичного
    объявления в отношении любой такой передачи активов или Смены Контроля.
    | Независимо от любых иных положений настоящего Соглашения, в случае расторжения
    по настоящему пункту 12.04 ExxonMobil вправе прекратить любые лицензии,
    предоставленные FCE по настоящему Соглашению, которые в ином случае продолжали
    бы действовать после прекращения, с учётом обстоятельств, связанных со Сменой
    Контроля.
  severity: major
  category: contract_clause
