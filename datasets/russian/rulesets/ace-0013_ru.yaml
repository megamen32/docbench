id: ace-0013
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_8
  description: |
    При прекращении оказания Услуг HealthGate Издателям по любой причине
    HealthGate по выбору Издателей: (i) предоставит Издателям неисключительную,
    непередаваемую лицензию на использование Собственного Программного Обеспечения
    в целях использования, развития, улучшения и поддержки Сайта, а также выполнения
    любых или всех видов деятельности, ранее осуществлявшихся HealthGate или
    от её имени по настоящему Соглашению; (ii) прилагает все разумные усилия
    для предоставления Издателям неисключительной, непередаваемой лицензии
    на использование Стороннего Программного Обеспечения для Сайта в случае
    и в объёме, запрошенных Издателями. | Совместная с Издателями разработка
    плана упорядоченного перехода Услуг (далее — «План Перехода»), выполняемых
    в тот момент HealthGate, от HealthGate к Издателям или такому преемнику
    поставщика Услуг. | Предоставление разумного обучения персоналу Издателей
    в целях оказания Услуг, передаваемых Издателям или такому преемнику поставщика
    Услуг. | Период взаимодействия начинается с момента уведомления о прекращении
    настоящего Соглашения и продолжается максимум в течение 3 месяцев после
    прекращения. | При прекращении настоящего Соглашения и в течение шести
    (6) месяцев после этого Издатели имеют следующие права и обязанности:
    33.1. Начиная с любого уведомления о прекращении со стороны Издателей,
    HealthGate обязуется соблюдать разумные указания Издателей и предоставлять
    Издателям любую и всю помощь при прекращении, разумно запрошенную Издателями,
    чтобы позволить продолжение Услуг и содействовать упорядоченной передаче
    обязанностей по оказанию Услуг Издателям или назначенному ими преемнику
    поставщика Услуг. Помощь при прекращении, предоставляемая HealthGate Издателям,
    может включать: 33.1.1. Продолжение выполнения в течение разумного периода
    (определяемого Издателями) до шести (6) месяцев с даты прекращения любых
    или всех Услуг, выполняемых в тот момент HealthGate. | HealthGate соглашается,
    что в момент прекращения настоящего Соглашения она окажет всё содействие,
    предоставит всю документацию и предпримет все действия в объёме, необходимом
    для обеспечения упорядоченного принятия Услуг Издателями или, по выбору
    Издателей, заменяющим подрядчиком. | Если в тот момент HealthGate использует
    любое Оборудование, арендованное или принадлежащее Издателям, для оказания
    услуг любому третьему лицу, HealthGate может продолжать использовать это
    Оборудование для этой цели до тех пор, пока HealthGate не сможет разумно
    перейти на другое оборудование. | HealthGate будет взаимодействовать с
    Издателями, предоставляя для этих целей такой связной персонал HealthGate,
    который Издатели могут разумно потребовать, и действуя добросовестно, чтобы
    обеспечить взаимоприемлемую лицензию Издателям или, по выбору Издателей,
    заменяющему подрядчику.
  severity: major
  category: contract_clause
