id: ace-0014
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_4
  description: Участник не несёт ответственности перед Совместным Предприятием или
    перед любым другим Участником за любую ошибку или заблуждение в суждении,
    либо за любое действие или бездействие, совершённое добросовестно и которое
    он считал совершаемым в пределах полномочий, предоставленных или подразумеваемых
    настоящим Соглашением или Совместным Предприятием.
  severity: major
  category: contract_clause
- id: evidence_5
  description: Совместное Предприятие вправе приобретать страховку от имени любого
    Участника, работника, агента или иного лица, занятого в коммерческой деятельности
    Совместного Предприятия, от любой ответственности, заявленной против них
    или понесённой ими при осуществлении добросовестной деятельности от имени
    Совместного Предприятия.
  severity: major
  category: contract_clause
