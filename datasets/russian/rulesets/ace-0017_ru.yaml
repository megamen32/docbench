id: ace-0017
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_6
  description: Nantz соглашается быть доступным для проведения до четырёх фотосессий
    (2 в Южной Калифорнии в течение недели и 2 в местах расположения или на
    турнирах Nantz), двух публичных выступлений и трёх появлений в магазинах
    в течение каждого Года Действия Договора, в согласованные между Nantz и
    Компанией время и места, но ни в коем случае не во время, неблагоприятно
    влияющее на расписание Nantz Communications или Nantz. | Компания соглашается,
    что каждая фотосессия не должна превышать полутора дней, а каждое публичное
    выступление и появление в магазине не должно превышать полудня.
  severity: major
  category: contract_clause
