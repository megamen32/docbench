id: ace-0005
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_1
  description: |
    Если настоящее Соглашение продлевается на Первый Дополнительный Срок,
    то Первый Дополнительный Срок начинается 23 июля 2016 года, и Соглашение
    автоматически истекает и прекращается без дополнительного уведомления 22
    июля 2019 года. | Если настоящее Соглашение продлевается на Второй Дополнительный
    Срок, то Второй Дополнительный Срок начинается 23 июля 2019 года и Соглашение
    автоматически истекает и прекращается без дополнительного уведомления 22
    июля 2022 года. | В случае если MusclePharm достигнет совокупного объёма
    Чистых Продаж (как определено ниже) в размере 20 миллионов долларов США (далее
    — «Первый Порог Продления») в течение Третьего Года Действия Договора, настоящее
    Соглашение автоматически продлевается на дополнительный срок три (3) года
    (далее — «Первый Дополнительный Срок») на тех же условиях, что и Начальный
    Срок, за исключением того, что: (i) никакое дополнительное Вознаграждение
    Акциями (как определено ниже) не выпускается в связи с продлённым Сроком;
    (ii) Денежное Вознаграждение за Первый Дополнительный Срок устанавливается
    согласно Разделу 7 и Разделу (2) Приложения «C», прилагаемому к настоящему
    Соглашению; (iii) Контрактор обязуется провести только два (2) Появления
    в каждом Году Действия Договора в течение Первого Дополнительного Срока в
    соответствии с пунктом 4(a)(ii) ниже; и (iv) маркетинговый бюджет на продвижение
    Лицензированных Продуктов составляет 5,0 миллиона долларов в течение каждого
    Года Действия Договора Первого Дополнительного Срока (с учётом пункта 12(b)
    настоящего Соглашения). | В случае если MusclePharm достигнет объёма Чистых
    Продаж в размере 50 миллионов долларов (далее — «Второй Порог Продления»)
    совокупно в течение шестого Года Действия Договора, настоящее Соглашение
    автоматически продлевается на дополнительный срок три (3) года (далее —
    «Второй Дополнительный Срок») на тех же условиях, что и начальный Срок, за
    исключением того, что: (i) никакое дополнительное Вознаграждение Акциями
    не выпускается в связи с продлённым Сроком; (ii) Денежное Вознаграждение
    за продлённый Срок устанавливается согласно Разделу 7 и Разделу (3) Приложения
    «C»; (iii) Контрактор проводит только два (2) Появления в каждом Году Действия
    Договора в течение Второго Дополнительного Срока в соответствии с пунктом
    4(a)(ii) ниже; и (iv) маркетинговый бюджет на продвижение Лицензированных
    Продуктов составляет 5,0 миллиона долларов в каждом Году Действия Договора
    Второго Дополнительного Срока (с учётом пункта 12(b) настоящего Соглашения).
  severity: major
  category: contract_clause
- id: evidence_3
  description: |
    Независимо от вышеизложенного, нижеследующее не будет считаться нарушением
    настоящего Соглашения: (i) исполнение Контрактором услуг или появление
    в новостной или информационной части любой радио-, телевизионной или кинопрограммы
    или развлекательной передачи, (продолжение следует).
  severity: major
  category: contract_clause
