institution: ACE (Fujitsu)
rules:
- id: evidence_2
  description: Настоящее Соглашение, включая его приложения и подтверждения заказов
    по Соглашению, представляет собой полное соглашение между Дистрибьютором и
    NETGEAR в отношении покупки, перепродажи и распространения Продуктов и регулируется
    правом штата Калифорния, за исключением коллизионных норм.
  severity: major
  category: contract_clause
- id: evidence_6
  description: Общая стоимость возвращённых Продуктов не должна превышать [***] от
    стоимости Чистых Поставок, выставленных NETGEAR в счётах за все Продукты,
    [***], в течение [***], непосредственно предшествующих каждой из указанных
    выше дат.
  severity: major
  category: contract_clause
- id: evidence_8
  description: ЗА ИСКЛЮЧЕНИЕМ УБЫТКОВ, ВОЗНИКАЮЩИХ В РЕЗУЛЬТАТЕ НАРУШЕНИЯ РАЗДЕЛОВ
    6.C И 12, 13 ИЛИ 17, НИ В КОЕМ СЛУЧАЕ ОБЩАЯ ОТВЕТСТВЕННОСТЬ ДИСТРИБЬЮТОРА ЗА
    ЛЮБЫЕ УБЫТКИ В ЛЮБОМ ИСКЕ, ОСНОВАННОМ НА НАСТОЯЩЕМ СОГЛАШЕНИИ ИЛИ ВОЗНИКАЮЩЕМ
    В СВЯЗИ С НИМ, НЕ ПРЕВЫШАЕТ [***] NETGEAR В СООТВЕТСТВИИ С НАСТОЯЩИМ СОГЛАШЕНИЕМ.
    | ЗА ИСКЛЮЧЕНИЕМ УБЫТКОВ, ВОЗНИКАЮЩИХ В СИЛУ РАЗДЕЛОВ 14.A И 16.A, НИ В КОЕМ
    СЛУЧАЕ ОБЩАЯ ОТВЕТСТВЕННОСТЬ NETGEAR ИЛИ BAY NETWORKS ЗА ЛЮБЫЕ УБЫТКИ В ЛЮБОМ
    ИСКЕ, ОСНОВАННОМ НА НАСТОЯЩЕМ СОГЛАШЕНИИ ИЛИ ВОЗНИКАЮЩЕМ В СВЯЗИ С НИМ, НЕ
    ПРЕВЫШАЕТ [***] NETGEAR В СООТВЕТСТВИИ С НАСТОЯЩИМ СОГЛАШЕНИЕМ.
  severity: major
  category: contract_clause
