id: ace-0025
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_6
  description: Если Tripath расторгает Соглашение в соответствии с пунктами 18.1
    или 18.2, либо если Дистрибьютор расторгает Соглашение в соответствии с
    пунктом 18.3, Tripath обязуется приобрести, а Дистрибьютор обязуется перепродать
    Tripath оставшиеся у Дистрибьютора запасы Продуктов (за исключением снятых
    с производства и демонстрационных Продуктов согласно Дистрибьюторскому
    Соглашению), которые Tripath признает неповреждёнными и в хорошем состоянии
    (включая, по выбору Tripath, осмотр на месте). Цена таких запасов равна
    цене, фактически уплаченной Дистрибьютором, за вычетом ранее предоставленных
    скидок или иных уступок. | Если Дистрибьютор расторгает Соглашение в соответствии
    с пунктами 18.1 или 18.2, либо если Tripath расторгает Соглашение в соответствии
    с пунктом 18.3, Tripath вправе по своему выбору приобрести, а Дистрибьютор
    обязуется перепродать Tripath все или часть запасов Дистрибьютора по цене,
    указанной в пункте 18.4, за вычетом десятипроцентной стоимости обратной
    приёмки. | После прекращения настоящего Соглашения Дистрибьютор незамедлительно
    прекращает любое дальнейшее использование товарных знаков, торговых наименований
    или знаков обслуживания Tripath, за исключением случаев, когда это требуется
    для продажи Продуктов из запасов.
  severity: major
  category: contract_clause
- id: evidence_7
  description: Вышеизложенные положения настоящего раздела 19 устанавливают полную
    ответственность и обязательства Tripath и исключительное средство правовой
    защиты Дистрибьютора и его клиентов в отношении любого фактического или
    предполагаемого нарушения прав интеллектуальной собственности в отношении
    Продуктов. | Ни Tripath, ни Дистрибьютор не несут ответственности за какие-либо
    побочные или косвенные убытки (включая, без ограничения, убытки в виде
    потери коммерческой прибыли, перерыва в коммерческой деятельности, потери
    деловой информации или иного имущественного ущерба), вытекающие из настоящего
    Соглашения, даже если им было сообщено о возможности таких убытков.
  severity: major
  category: contract_clause
