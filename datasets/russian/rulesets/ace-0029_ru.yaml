id: ace-0029
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_7
  description: С учётом любых ограничений, которые NTC письменно сообщает ALFA AESAR,
    NTC настоящим предоставляет ALFA AESAR лицензию на использование, демонстрацию,
    цитирование, переформатирование, изменение, воспроизведение, публикацию,
    публичное исполнение и передачу через Интернет, а также иное использование
    такого контента NTC для целей маркетинга, рекламы и продвижения Продуктов,
    при условии, что ALFA AESAR получает предварительное письменное одобрение
    NTC на включение контента NTC в такие материалы. | ALFA AESAR настоящим
    предоставляет NTC ограниченную неисключительную лицензию на использование
    Товарных Знаков ALFA AESAR в форме, предоставленной ALFA AESAR, в течение
    Срока действия настоящего Соглашения в соответствии с условиями, изложенными
    в нём. | NTC настоящим предоставляет ALFA AESAR ограниченную неисключительную
    лицензию на использование, демонстрацию, цитирование, воспроизведение,
    публикацию, публичное исполнение и передачу через Интернет, а также иное
    использование Товарных Знаков NTC в форме, существенно соответствующей той,
    которую NTC может периодически предоставлять ALFA AESAR в течение Срока
    действия настоящего Соглашения в соответствии с условиями, изложенными в
    нём. | Такая лицензия предоставляется исключительно в связи с правами
    и обязательствами NTC по настоящему Соглашению и, в частности, для целей
    лицензирования NTC на использование Товарного Знака ALFA AESAR на веб-сайте
    NTC, как прямо предусмотрено настоящим Соглашением, для направления клиентов,
    заказывающих Исследовательские Количества, в ALFA AESAR, а также в качестве
    ссылки/навигационной кнопки на Сайт ALFA AESAR. | Такая лицензия предоставляется
    исключительно в связи с правами и обязательствами ALFA AESAR по настоящему
    Соглашению и, в частности, для целей лицензирования ALFA AESAR на использование
    Товарных Знаков NTC в маркетинговых, продающих и дистрибьюторских материалах
    ALFA AESAR, относящихся к Продуктам, включая, без ограничения, использование
    на веб-сайте ALFA AESAR в качестве ссылки/навигационной кнопки на веб-сайт
    NTC, как размещено NTC.
  severity: major
  category: contract_clause
