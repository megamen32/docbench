id: ace-0007
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_4
  description: |
    В течение Срока, в отношении деятельности, описанной в настоящем
    Соглашении, IMNTV настоящим предоставляет Дистрибьютору неисключительные
    права и лицензии, необходимые в пределах Территории, на: (a) копирование,
    хранение в цифровой форме, размещение и потоковую передачу Программирования;
    (b) публичное исполнение, публичный показ, электронную передачу, распространение
    и трансляцию Программирования; (c) продвижение Программирования и использование
    Знаков IMNTV для целей продвижения Программирования Дистрибьютором в рамках
    деятельности, описанной в пункте 2.4 выше; (d) архивирование Программирования
    на серверах Дистрибьютора; (e) кодирование, копирование и создание непрерывных
    отрывков Программирования длительностью до шестидесяти (60) секунд и передачу,
    публичное исполнение, распространение и перераспределение таких отрывков.
  severity: major
  category: contract_clause
