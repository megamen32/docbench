institution: ACE (Fujitsu)
rules:
- id: evidence_2
  description: Настоящее Соглашение подлежит автоматическому продлению на последовательные
    периоды продолжительностью один (1) год, если ни одна из сторон не направит
    письменное уведомление, не менее чем за девяносто (90) дней до даты годовщины,
    о том, что продление Соглашения не требуется.
  severity: major
  category: contract_clause
