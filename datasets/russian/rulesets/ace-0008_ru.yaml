id: ace-0008
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_3
  description: |
    В дополнение к этому и при условии завершения сделки на условиях,
    изложенных ниже, Вам будет предоставлен второй опцион в соответствии с
    Опционным планом, причем такой опцион является одним из следующих: (a)
    опцион на приобретение 44 757 Акций (составляющих приблизительно 0,25%
    выпущенного акционерного капитала Компании на Дату вступления в силу),
    предоставляемый как можно скорее после завершения сделки, одобренной Советом
    директоров, на условиях, включающих первоначальный платёж в размере не
    менее 30 000 000 долларов США и поэтапные платежи по каждому продукту downstream
    в размере не менее 300 000 000 долларов США; либо (b) опцион на приобретение
    22 378 Акций (составляющих приблизительно 0,125% выпущенного акционерного
    капитала Компании на Дату вступления в силу), предоставляемый как можно
    скорее после завершения сделки, одобренной Советом директоров, на условиях,
    включающих первоначальный платёж в размере 24 000 000 долларов США и поэтапные
    платежи по каждому продукту downstream в размере 240 000 000 долларов США;
    либо (c) опцион на приобретение такого количества Акций (в диапазоне от
    0,125% до 0,25% выпущенного акционерного капитала Компании на Дату вступления
    в силу, определяемого по абсолютному усмотрению Совета директоров), предоставляемый
    как можно скорее после завершения сделки, одобренной Советом директоров,
    на условиях, включающих первоначальный платёж в размере более 24 000 000
    долларов США, но менее 30 000 000 долларов США, и поэтапные платежи по каждому
    продукту downstream в размере более 240 000 000 долларов США, но менее
    300 000 000 долларов США. | На Дату вступления в силу или как можно скорее
    после неё предполагается предоставить Вам опцион в соответствии с Опционным
    планом на приобретение 107 417 обыкновенных акций BTL (далее — «Акции»)
    (составляющих приблизительно 0,6% выпущенного акционерного капитала Компании
    на Дату вступления в силу).
  severity: major
  category: contract_clause
