- id: evidence_8
  description: В течение Срока, в соответствии с условиями настоящего Соглашения,
    Depomed настоящим предоставляет King и её Аффилированным лицам, а King
    и её Аффилированные лица настоящим принимают соисключительное право на
    Продвижение Продукта под Знаками Depomed на Территории совместно с Depomed
    и её Аффилированными лицами исключительно, на условиях и при условиях,
    изложенных в настоящем Соглашении.
  severity: major
  category: contract_clause
