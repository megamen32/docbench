id: ace-0024
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_3
  description: 1. Для целей настоящего Соглашения «Информация» означает конфиденциальные
    или охраняемые коммуникации или данные любой из Сторон настоящего Соглашения,
    включая коммерческую информацию, финансовую информацию, маркетинговые планы.
    | техническую или финансовую информацию, списки клиентов или предложения,
    эскизы, модели, образцы, компьютерные программы и документацию, чертежи,
    спецификации, вне зависимости от того, передаются ли они в устной, письменной,
    графической или электромагнитной форме или иным образом, а также все заметки,
    аналитические материалы, подборки, прогнозы, исследования, интерпретации
    или иные документы, подготовленные любой из Сторон, в той мере, в какой они
    содержат любую такую информацию.
  severity: major
  category: contract_clause
