id: ace-0021
version: ace1
institution: ACE (Fujitsu)
rules:
- id: evidence_10
  description: Если Получающая Сторона является компанией, Получающая Сторона вправе
    раскрывать Конфиденциальную Информацию | (i) директорам, должностным лицам
    и работникам Получающей Стороны (совместно именуемым «Представители»),
    в каждом случае лишь в объёме, разумно необходимом для внутреннего использования
    Получающей Стороной, и только после информирования каждого Представителя
    об ограничениях по настоящему Соглашению на раскрытие и использование Конфиденциальной
    Информации и о том, что он обязан соблюдать такие ограничения, и | Получающая
    Сторона вправе раскрывать CEII | (i) только тем своим Представителям, которые
    надлежащим образом подписали индивидуальные соглашения о неразглашении
    или конфиденциальности в рамках своей трудовой деятельности, специально
    относящиеся к конфиденциальной информации и CEII, которые они получают
    в ходе своей трудовой деятельности.
  severity: major
  category: contract_clause
- id: evidence_7
  description: Если Получающая Сторона является компанией, Получающая Сторона вправе
    раскрывать Конфиденциальную Информацию | (i) директорам, должностным лицам
    и работникам Получающей Стороны (совместно именуемым «Представители»),
    в каждом случае лишь в объёме, разумно необходимом для внутреннего использования
    Получающей Стороной, и только после информирования каждого Представителя
    об ограничениях по настоящему Соглашению на раскрытие и использование Конфиденциальной
    Информации и о том, что он обязан соблюдать такие ограничения, и | (ii)
    любому иному лицу или организации только с предварительного письменного
    согласия Раскрывающих Сторон в каждом конкретном случае. | Получающая Сторона
    обязуется сохранять всю Конфиденциальную Информацию в строгой конфиденциальности
    и обязуется без предварительного письменного согласия соответствующей
    Раскрывающей Стороны в каждом конкретном случае не раскрывать Конфиденциальную
    Информацию или любые отчёты, результаты работ или иные документы, содержащие
    Конфиденциальную Информацию, любому третьему лицу, фирме, корпорации или
    организации. | Получающая Сторона обязуется без предварительного письменного
    согласия соответствующей Раскрывающей Стороны в каждом конкретном случае
    не раскрывать CEII или любые отчёты, результаты работ или иные документы,
    содержащие CEII, любому третьему лицу, фирме, корпорации или организации.
  severity: major
  category: contract_clause
