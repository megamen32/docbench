id: ace_0010
benchmark: conformance
ruleset: ace-0010
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 10
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_10] По истечении срока действия либо прекращении либо Договора
      аренды, либо Франчайзингового договора (прилагается), Арендодатель будет
      сотрудничать с Франчайзером и оказывать ему содействие в получении владения
      Помещением, и если Франчайзер не пожелает принять на себя права Арендатора,
      Арендодатель разрешит Франчайзеру войти в Помещение, не считаясь нарушителем
      владения и не неся какой-либо ответственности перед Арендодателем, чтобы
      убрать все вывески, навесы и другие элементы, идентифицирующие Помещение
      как Франчайзинговый Бизнес, а также произвести другие модификации (такие
      как перекраска), которые разумно необходимы для защиты Знаков The Joint
      и Системы, а также для отличия Помещения от Франчайзингового Бизнеса.
      | По прекращении или истечении срока действия Франшизы мы будем иметь
      право, но не обязанность, реализуемое в течение тридцати (30) дней путём
      письменного уведомления Вас, приобрести по справедливой рыночной стоимости
      все активы Франчайзингового Бизнеса, включая всё одобренное оборудование,
      оснастку, мебель и вывески, а также все материалы, сырьё и другие предметы,
      маркированные каким-либо Знаком, и принять на себя права по договору
      аренды Помещения и любому другому договору аренды или концессионному договору,
      необходимому для ведения Франчайзингового Бизнеса.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Арендодатель, связанный Договором аренды и Франчайзинговым договором,
      сталкивается с ситуацией, когда Франчайзинговый договор истекает 1 марта
      2023 года, тогда как Договор аренды остаётся действующим до 31 декабря
      2023 года. 25 февраля 2023 года Франчайзер направляет Арендодателю неформальное
      электронное письмо, выражая своё намерение воспользоваться опционом на
      приобретение активов Франшизы и принятие на себя прав по аренде. Письмо
      является расплывчатым и упоминает лишь общее намерение без указания цены
      покупки или подробного перечня активов. Полагая, что этого достаточно
      для запуска прав Франчайзера, Арендодатель действует упреждающе. 2 марта
      2023 года, на следующий день после истечения Франчайзингового договора,
      Арендодатель предоставляет Франчайзеру немедленный доступ в Помещение
      для снятия вывесок и проведения модификаций с целью отличить Помещение
      от Франчайзингового Бизнеса. Арендодатель также соглашается разрешить
      Франчайзеру временно хранить часть снятых активов в защищённой зоне Помещения,
      ссылаясь на необходимость избежать нарушения операций на объекте. Однако
      Франчайзер не направляет официального письменного уведомления с разъяснением
      своего намерения приобрести активы и принять на себя аренду до 20 марта
      2023 года, то есть в пределах 30-дневного срока. Тем временем Арендатор,
      не зная о договорённости, 10 марта 2023 года подаёт официальную жалобу,
      обвиняя Арендодателя в нарушении его обязательств по Договору аренды,
      выразившемся в допуске Франчайзера к вмешательству в деятельность Арендатора
      и снятию активов без надлежащего оформления реализации опциона на покупку.
      Арендатор также заявляет, что санкционирование Арендодателем модификаций
      представляет собой недобросовестное поведение, поскольку оно произошло
      до того, как Франчайзер направил формальное письменное уведомление. Арендодатель
      защищает свои действия, утверждая, что действовал строго в соответствии
      с условием, требующим сотрудничества с Франчайзером для обеспечения владения
      и защиты его знаков, что, по его мнению, отличается от процесса приобретения
      активов. Ситуация перерастает в юридический спор о том, нарушили ли ранние
      действия Арендодателя Договор аренды и условный приоритет Франчайзингового
      договора.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
