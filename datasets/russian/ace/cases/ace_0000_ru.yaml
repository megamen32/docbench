  agreement:
    kind: agreement
    title: Сценарий ACE 0
    fields: {}
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_2] Настоящее Соглашение, включая его приложения и подтверждения
      заказов по Соглашению, представляет собой полное соглашение между Дистрибьютором
      и NETGEAR в отношении покупки, перепродажи и распространения Продуктов и
      регулируется правом штата Калифорния, за исключением коллизионных норм.


      [evidence_6] Общая стоимость возвращённых Продуктов не должна превышать [***]
      от стоимости Чистых Поставок, выставленных NETGEAR в счётах за все Продукты,
      [***], в течение [***], непосредственно предшествующих каждой из указанных
      выше дат.


      [evidence_8] ЗА ИСКЛЮЧЕНИЕМ УБЫТКОВ, ВОЗНИКАЮЩИХ В РЕЗУЛЬТАТЕ НАРУШЕНИЯ
      РАЗДЕЛОВ 6.C И 12, 13 ИЛИ 17, НИ В КОЕМ СЛУЧАЕ ОБЩАЯ ОТВЕТСТВЕННОСТЬ ДИСТРИБЬЮТОРА
      ЗА ЛЮБЫЕ УБЫТКИ В ЛЮБОМ ИСКЕ, ОСНОВАННОМ НА НАСТОЯЩЕМ СОГЛАШЕНИИ ИЛИ ВОЗНИКАЮЩЕМ
      В СВЯЗИ С НИМ, НЕ ПРЕВЫШАЕТ [***] NETGEAR В СООТВЕТСТВИИ С НАСТОЯЩИМ
      СОГЛАШЕНИЕМ. | ЗА ИСКЛЮЧЕНИЕМ УБЫТКОВ, ВОЗНИКАЮЩИХ В СИЛУ РАЗДЕЛОВ 14.A И
      16.A, НИ В КОЕМ СЛУЧАЕ ОБЩАЯ ОТВЕТСТВЕННОСТЬ NETGEAR ИЛИ BAY NETWORKS
      ЗА ЛЮБЫЕ УБЫТКИ В ЛЮБОМ ИСКЕ, ОСНОВАННОМ НА НАСТОЯЩЕМ СОГЛАШЕНИИ ИЛИ ВОЗНИКАЮЩЕМ
      В СВЯЗИ С НИМ, НЕ ПРЕВЫШАЕТ [***] NETGEAR В СООТВЕТСТВИИ С НАСТОЯЩИМ
      СОГЛАШЕНИЕМ.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      NETGEAR заключает дистрибьюторское соглашение с Bay Networks, включающее
      условие, запрещающее, чтобы общая стоимость возвращённых продуктов превышала
      определённый процент от чистых поставок, выставленных в счётах в течение
      непосредственно предшествующего квартала (evidence_6). В четвёртом квартале
      NETGEAR сталкивается с резким ростом возвратов продуктов из-за дефекта
      в недавно выпущенном маршрутизаторе. Чтобы урегулировать ситуацию, NETGEAR
      поручает Bay Networks временно приостановить все возвраты и оформить заказы
      на замену для компенсации возвратов, как это разрешено условием о гарантии.
      Однако дефект оказывается шире, чем первоначально предполагалось, и NETGEAR
      решает оформить гарантийные замены для дополнительной линейки продуктов
      без формального документирования в рамках гарантийных претензий. Это действие
      создаёт несоответствие: в то время как NETGEAR рассчитывает возвраты в
      пределах допустимого порога, учитывая незадокументированные замены как гарантийные
      корректировки, официальные записи Bay Networks по-прежнему классифицируют
      их как возвраты. Одновременно NETGEAR сообщает о своём решении с помощью
      внутреннего инструмента для совместной работы, минуя предусмотренный канал
      электронной почты (evidence_2). Bay Networks поднимает этот вопрос, утверждая,
      что незадокументированные замены не могут быть переклассифицированы без
      формального подтверждения в соответствии с условием о гарантии. Дополнительно
      Bay Networks указывает на evidence_8, которое ограничивает ответственность
      за убытки, за исключением случаев, предусмотренных конкретными разделами.
      Это создаёт неопределённость в отношении того, может ли переклассификация
      NETGEAR повлечь ответственность в соответствии с этими разделами. Несмотря
      на настаивание NETGEAR о том, что общие возвраты остаются в пределах допустимого
      порога, Bay Networks утверждает, что переклассификация создаёт каскадный
      отказ зависимости, поскольку незадокументированные замены подрывают прозрачность,
      требуемую регулирующими условиями.'
