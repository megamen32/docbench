id: ace_0029
benchmark: conformance
ruleset: ace-0029
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 29
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_7] С учётом любых ограничений, которые NTC письменно сообщает
      ALFA AESAR, NTC настоящим предоставляет ALFA AESAR лицензию на использование,
      демонстрацию, цитирование, переформатирование, изменение, воспроизведение,
      публикацию, публичное исполнение и передачу через Интернет, а также иное
      использование такого контента NTC для целей маркетинга, рекламы и продвижения
      Продуктов, при условии, что ALFA AESAR получает предварительное письменное
      одобрение NTC на включение контента NTC в такие материалы. | ALFA AESAR
      настоящим предоставляет NTC ограниченную неисключительную лицензию на
      использование Товарных Знаков ALFA AESAR в форме, предоставленной ALFA
      AESAR, в течение Срока действия настоящего Соглашения в соответствии с
      условиями, изложенными в нём. | NTC настоящим предоставляет ALFA AESAR
      ограниченную неисключительную лицензию на использование, демонстрацию,
      цитирование, воспроизведение, публикацию, публичное исполнение и передачу
      через Интернет, а также иное использование Товарных Знаков NTC в форме,
      существенно соответствующей той, которую NTC может периодически предоставлять
      ALFA AESAR в течение Срока действия настоящего Соглашения в соответствии
      с условиями, изложенными в нём. | Такая лицензия предоставляется исключительно
      в связи с правами и обязанностями NTC по настоящему Соглашению и, в частности,
      для целей лицензирования NTC на использование Товарного Знака ALFA AESAR
      на веб-сайте NTC, как прямо предусмотрено настоящим Соглашением, для направления
      клиентов, заказывающих Исследовательские Количества, в ALFA AESAR, а также
      в качестве ссылки/навигационной кнопки на Сайт ALFA AESAR. | Такая лицензия
      предоставляется исключительно в связи с правами и обязанностями ALFA AESAR
      по настоящему Соглашению и, в частности, для целей лицензирования ALFA AESAR
      на использование Товарных Знаков NTC в маркетинговых, продающих и дистрибьюторских
      материалах ALFA AESAR, относящихся к Продуктам, включая, без ограничения,
      использование на веб-сайте ALFA AESAR в качестве ссылки/навигационной
      кнопки на веб-сайт NTC, как размещено NTC.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      NTC и ALFA AESAR действуют в рамках лицензионного соглашения со сложными
      множественно-условными пунктами. NTC предоставило ALFA AESAR лицензию на
      использование своих товарных знаков и контента в целях маркетинга при условии,
      что ALFA AESAR получает предварительное письменное одобрение на любые
      материалы, включающие контент NTC. В течение срока действия соглашения
      ALFA AESAR планирует промо-кампанию с использованием товарных знаков и контента
      NTC. Для выполнения требования «предварительного письменного одобрения»
      ALFA AESAR направляет неформальное электронное письмо менеджеру по маркетингу
      NTC с приложенными предлагаемыми материалами. Электронное письмо содержит
      фразу: «Дайте знать, подходит ли это вам». Менеджер по маркетингу отвечает
      эмодзи «палец вверх». Впоследствии ALFA AESAR публикует материалы в интернете,
      заметно выделяя товарные знаки и контент NTC. Третья сторона выражает опасения,
      утверждая, что ALFA AESAR нарушило соглашение, поскольку способ одобрения
      (эмодзи) был непрфессиональным и неоднозначным, что ставит под сомнение,
      составляло ли оно «предварительное письменное одобрение», предусмотренное
      условием. Дополнительно, промо-материалы содержат переформатированный контент
      NTC, что, по утверждению третьей стороны, было изменено без явного разрешения.
      NTC не высказывает никаких возражений и продолжает сотрудничество с ALFA
      AESAR.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
