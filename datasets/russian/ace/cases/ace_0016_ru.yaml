ruleset: ace-0016
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 16
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_10] Клиент настоящим предоставляет EFS ограниченное и бессрочное
      право и лицензию на использование таких фотографий и материалов в целях
      исследования и прогнозирования, включая, но не ограничиваясь, объединение
      их с отчётами и аналитикой, относящимися к работе Веб-сайтов, предоставление
      информации стратегическим партнёрам для лучшего определения потребительских
      привычек и для целей прогнозирования трендов и планирования. | Бизнес.
      | Клиент владеет определёнными данными клиентов, относящимися к Бизнесу
      электронной коммерции Playboy (далее — «Существующие Данные Клиентов»),
      и настоящим предоставляет EFS неисключительную, ограниченную, не подлежащую
      сублицензированию, непередаваемую, отзывную лицензию на хранение и использование
      таких Существующих Данных Клиентов исключительно в целях ведения и продвижения
      Бизнеса электронной коммерции Playboy. | Все Производные Произведения
      настоящим лицензируются обратно EFS с учётом ограничений, применимых
      по настоящему Соглашению к Контенту Playboy. | В течение Срока и в соответствии
      с условиями и ограничениями, изложенными в настоящем Соглашении, Клиент
      предоставляет EFS ограниченную, неисключительную, непередаваемую, не
      подлежащую уступке (без права сублицензирования), всемирную лицензию на
      использование товарных знаков и/или знаков обслуживания Клиента, указанных
      в Части A Приложения 1 (далее — «Знаки Playboy»), исключительно в связи
      с разработкой, публикацией, распространением, ведением и продвижением
      Бизнеса электронной коммерции Playboy. | Все такие фотографии считаются
      Контентом Playboy для целей настоящего Соглашения, в отношении которого
      EFS имеет лицензию на использование в течение Срока исключительно в связи
      с Бизнесом электронной коммерции Playboy и по мере необходимости для продвижения
      Веб-сайтов. | В течение Срока и в соответствии с условиями и ограничениями,
      изложенными в настоящем Соглашении, Клиент предоставляет EFS ограниченную,
      неисключительную, непередаваемую, не подлежащую уступке (без права сублицензирования),
      всемирную лицензию на использование, изменение, создание производных
      произведений, публикацию, воспроизведение, трансляцию, демонстрацию и
      показ Контента Playboy исключительно в связи с разработкой, публикацией,
      распространением, ведением и продвижением Бизнеса электронной коммерции
      Playboy. | В течение Срока и в соответствии с условиями и ограничениями
      настоящего Соглашения Клиент настоящим предоставляет EFS ограниченную,
      непередаваемую, не подлежащую уступке (без права сублицензирования) всемирную
      лицензию на использование идентификаторов интернет-ресурсов (URL, доменные
      имена и т. д.), указанных в Части B Приложения 1 к настоящему Соглашению,
      и/или, в той мере, в какой это заранее одобрено Клиентом в письменной
      форме, в зависимости от обстоятельств, их модификаций (далее — «Лицензированные
      Доменные Имена»), в качестве доменного имени (имён) и интернет-идентификаторов
      для Веб-сайтов в течение Срока.


      [evidence_11] Бизнес. | Клиент владеет определёнными данными клиентов, относящимися
      к Бизнесу электронной коммерции Playboy (далее — «Существующие Данные Клиентов»),
      и настоящим предоставляет EFS неисключительную, ограниченную, не подлежащую
      сублицензированию, непередаваемую, отзывную лицензию на хранение и использование
      таких Существующих Данных Клиентов исключительно в целях ведения и продвижения
      Бизнеса электронной коммерции Playboy. | В течение Срока и в соответствии
      с условиями и ограничениями, изложенными в настоящем Соглашении, Клиент
      предоставляет EFS ограниченную, неисключительную, непередаваемую, не
      подлежащую уступке (без права сублицензирования) всемирную лицензию на
      использование товарных знаков и/или знаков обслуживания Клиента, указанных
      в Части A Приложения 1 (далее — «Знаки Playboy»), исключительно в связи
      с разработкой, публикацией, распространением, ведением и продвижением
      Бизнеса электронной коммерции Playboy. | В течение Срока и в соответствии
      с условиями и ограничениями, изложенными в настоящем Соглашении, Клиент
      предоставляет EFS ограниченную, неисключительную, непередаваемую, не
      подлежащую уступке (без права сублицензирования) всемирную лицензию на
      использование, изменение, создание производных произведений, публикацию,
      воспроизведение, трансляцию, демонстрацию и показ Контента Playboy исключительно
      в связи с разработкой, публикацией, распространением, ведением и продвижением
      Бизнеса электронной коммерции Playboy. | В течение Срока и в соответствии
      с условиями и ограничениями настоящего Соглашения Клиент настоящим предоставляет
      EFS ограниченную, непередаваемую, не подлежащую уступке (без права сублицензирования)
      всемирную лицензию на использование идентификаторов интернет-ресурсов
      (URL, доменные имена и т. д.), указанных в Части B Приложения 1 к настоящему
      Соглашению, и/или, в той мере, в какой это заранее одобрено Клиентом в
      письменной форме, в зависимости от обстоятельств, их модификаций (далее —
      «Лицензированные Доменные Имена»), в качестве доменного имени (имён)
      и интернет-идентификаторов для Веб-сайтов в течение Срока.


      [evidence_15] Такое уведомление должно включать письменное подтверждение
      и сведения о заменяющих страховых покрытиях и другие существенные изменения
      в полисах, которые вступают в силу немедленно при любой отмене или существенном
      изменении полисов EFS, чтобы не возникало пробелов в покрытии. | EFS
      соглашается, что эти полисы не будут отменены или существенно изменены без
      предварительного письменного уведомления Клиента не менее чем за тридцать
      (30) дней. | EFS обязуется в течение всего Срока действия настоящего Соглашения
      поддерживать страхование, как указано ниже, и указывать Клиента, его материнскую
      компанию, дочерние общества и аффилированные лица, а также соответствующих
      должностных лиц, директоров, акционеров, агентов и работников в качестве
      дополнительных застрахованных лиц в объёме возмещения, предусмотренного
      настоящим Соглашением, в соответствии со своими полисами ответственности
      следующим образом: (i) коммерческое страхование общей ответственности,
      включая ответственность за помещения/операции, страхование имущества по
      расширенной форме, ответственность независимых подрядчиков и договорную
      ответственность, покрывающую обязательства EFS по настоящему Соглашению
      в связи с телесными повреждениями и ущербом имуществу, с совокупным единым
      лимитом не менее 1 000 000 долларов США на каждый случай и зонтичным покрытием
      в размере 6 000 000 долларов США; (ii) страхование работников от несчастных
      случаев на производстве в установленных законом суммах, покрывающее EFS
      и её работников; и (iii) страхование от ошибок и упущений, а также страхование
      ответственности работодателя в размере не менее 1 000 000 долларов США
      на каждый несчастный случай/заболевание. | не ниже A-. | Всё требуемое
      выше страхование должно осуществляться страховыми компаниями, имеющими
      право вести деятельность в штате (штатах), где осуществляются операции,
      с рейтингом | EFS обязуется передать Клиенту при подписании Соглашения
      страховые сертификаты в качестве доказательства требуемого покрытия.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      EFS, в соответствии с условиями своего соглашения с Клиентом, обязано было
      поддерживать различные страховые полисы и предоставлять страховые сертификаты
      в качестве доказательства покрытия при подписании Соглашения и в течение всего
      Срока. На середине Срока EFS столкнулось с ситуацией, когда срок действия
      его полиса коммерческого страхования общей ответственности истекал в связи
      с прекращением деятельности страховщика в соответствующей юрисдикции. EFS
      обеспечило новый полис, удовлетворяющий указанным условиям, включая лимиты
      покрытия и указание Клиента в качестве дополнительного застрахованного
      лица «в объёме возмещения, предусмотренного настоящим Соглашением».
      Однако вместо предоставления официального страхового сертификата при оформлении
      полиса EFS предоставило подробное описание покрытия от страхового брокера,
      включающее лимиты полиса, застрахованных лиц и сроки действия. EFS обосновывало
      это тем, что описание покрытия было достаточным для подтверждения соответствия,
      поскольку содержало все необходимые детали, позволяющие Клиенту проверить
      действительность полиса. Дополнительно, EFS утверждало, что получение официального
      страхового сертификата привело бы к ненужным задержкам в бизнес-операциях,
      поскольку страховщик требовал дополнительного административного времени
      для выпуска сертификата. Одновременно EFS заверило Клиента, что сертификат
      будет направлен в течение двух недель, после того как страховщик завершит
      внутренние формальности. Хотя сам полис был активен и пробелов в покрытии
      не было, ответственный за соответствие сотрудник Клиента выразил опасения,
      что регулирующие условия прямо требовали «страховых сертификатов» в качестве
      доказательства покрытия, и что любая альтернативная документация являлась
      недостаточной. Несмотря на усилия EFS по ускорению выдачи сертификата, он
      был в итоге выпущен и предоставлен Клиенту через 12 дней после вступления
      в силу нового полиса, что оставило критический пробел в формальном доказательстве
      в промежуточный период.'
