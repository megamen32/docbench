id: ace_0027
benchmark: conformance
ruleset: ace-0027
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 27
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_4] Если после даты настоящего Соглашения и до тех пор, пока
      любая из Сторон является партнёром, участником или акционером Операционной
      Компании, Совместное Предприятие разработает или завершит разработку, либо
      обнаружит, либо приобретёт имущественные права на процесс или продукт,
      который на момент или после момента его разработки, обнаружения или приобретения
      имеет или может иметь какое-либо применение за пределами Области Соглашения,
      то соответствующее юридическое лицо Совместного Предприятия обязано предложить
      лицензию на использование такого процесса или продукта (или их производства)
      для такого применения каждой из Сторон на разумных коммерческих условиях
      (включая, без ограничения, возможную уплату роялти по рыночным ставкам),
      принимая во внимание время и средства, затраченные Совместным Предприятием,
      и с учётом других значимых коммерческих факторов. | Если любая из
      Сторон получила Предложение Третьего Лица, которое она намерена принять
      (далее — «Предложение»), такая Сторона (далее — «Сторона-Продавец») обязуется
      уведомить другую Сторону (далее — «Сторона-Рецепиент») о Предложении,
      причём такое уведомление должно включать копию Предложения и любую иную
      информацию, необходимую для того, чтобы Сторона-Рецепиент могла разумно
      оценить Предложение и потенциального покупателя. | Если после даты настоящего
      Соглашения и до тех пор, пока любая из Сторон является партнёром, участником
      или акционером Операционной Компании, такая Сторона или любое её Аффилированное
      лицо получит или обнаружит возможность использования Астаксантина в качестве
      Нутрицевтика (далее — «Возможность в сфере Нутрицевтики»), включая, без
      ограничения, разработку или завершение разработки, обнаружение или приобретение
      имущественных прав на продукт или процесс, связанный с использованием Астаксантина
      в качестве Нутрицевтика, такая Сторона обязуется (или обязуется обеспечить,
      чтобы её Аффилированное лицо) представить такую возможность Операционной
      Компании, предоставив Операционной Компании такое нарративное описание
      и бюджетную и иную информацию, которую такая Сторона (или её Аффилированные
      лица) могли подготовить или собрать в объёме, необходимом для оценки такой
      Возможности в сфере Нутрицевтики. | Сторона-Рецепиент имеет тридцать (30)
      дней с даты получения уведомления от Стороны-Продавца (далее — «Опционный
      Период»), чтобы выбрать одно из: (i) приобрести долю Стороны-Продавца в
      Операционной Компании либо (ii) продать свою долю в Операционной Компании
      Стороне-Продавцу, в любом случае на тех же условиях, которые содержатся
      в Предложении.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Компания A и Компания B являются партнёрами по совместному предприятию,
      действующему в рамках сложного соглашения с множественно-условными обязательствами.
      После даты вступления в силу соглашения Компания B обнаруживает собственную
      технологию синтеза Астаксантина, потенциально применимую в качестве Нутрицевтика.
      В соответствии с пунктом 3, Компания B предоставляет Операционной Компании
      краткое нарративное описание и высокоуровневую бюджетную оценку Возможности
      в сфере Нутрицевтики необычным способом: в виде комментария в общем документе
      управления проектом, используемом для внутреннего сотрудничества. Комментарий
      включает технические характеристики, рыночный потенциал и бюджетные показатели,
      но не содержит официального письма или уведомления по электронной почте.
      Одновременно Компания A получает Предложение Третьего Лица о покупке её
      доли в Операционной Компании. Компания A соблюдает пункт 2, направляя детали
      Предложения Компании B в виде вложения в одностраничном электронном письме,
      но опускает какое-либо пояснительное контекстное описание стратегических
      последствий Предложения. В течение 30-дневного Опционного Периода Компания
      B решает приобрести долю Компании A, ссылаясь на стратегическое соответствие
      новой технологии Астаксантина её долгосрочным целям. Хотя действия Компании
      B формально удовлетворяют требование пункта 3 о представлении Возможности
      в сфере Нутрицевтики, Компания A утверждает о несоответствии из-за неформального
      способа доставки и заявляет, что отсутствие подробного пояснения, сопровождавшего
      Предложение Третьего Лица, создало неоправданное давление в процессе принятия
      решения. Операционная Компания в итоге принимает представление Возможности
      в сфере Нутрицевтики от Компании B и завершает продажу доли Компании A.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
