id: ace_0023
benchmark: conformance
ruleset: ace-0023
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 23
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_8] В течение Срока, в соответствии с условиями настоящего Соглашения,
      Depomed настоящим предоставляет King и её Аффилированным лицам, а King
      и её Аффилированные лица настоящим принимают соисключительное право на
      Продвижение Продукта под Знаками Depomed на Территории исключительно совместно
      с Depomed и её Аффилированными лицами, на условиях и при условиях, изложенных
      в настоящем Соглашении.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Depomed заключает соисключительное соглашение о продвижении с King Pharmaceuticals,
      как изложено в контракте. Контракт предусматривает, что Depomed предоставляет
      King право на продвижение продукта под товарными знаками Depomed в пределах
      определённой территории, при условии, что деятельность по продвижению
      осуществляется «исключительно совместно с Depomed и её Аффилированными
      лицами», и что все действия осуществляются «при условиях, изложенных
      в настоящем Соглашении». В течение срока действия соглашения King инициирует
      маркетинговую кампанию по продвижению продукта, включающую промо-вебинары.
      В этих вебинарах представители King представляют продукт без прямого участия
      сотрудников Depomed во время живых сессий. Однако впоследствии документация
      показывает, что Depomed заранее одобрило все сценарии вебинаров и предоставило
      обучающие материалы King до начала кампании для обеспечения соответствия.
      Ситуация дополнительно осложняется, когда всплывает электронное письмо
      сотрудника King со словами: «Мы здесь ведём — Depomed реально не участвует».
      Это письмо стало распространяться в отрасли, вызывая опасения, что King
      мог нарушить требование соисключительности, действуя самостоятельно. Несмотря
      на это, Depomed подтвердило, что они заблаговременно рассмотрели все рекламные
      материалы и контролировали кампанию для обеспечения соответствия соглашению.
      King утверждает, что их действия соответствовали контракту, поскольку формулировка
      «совместно с Depomed» не требует физического сотрудничества во время каждого
      промо-мероприятия, а скорее обеспечивает взаимный контроль и предварительное
      одобрение деятельности.'
expected_findings: []
expected_disposition: accept
