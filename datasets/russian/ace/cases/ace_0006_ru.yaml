documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 6
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_12] 2. Термин «Оценочный Материал» не включает какую-либо информацию,
      которая | (ii) была или стала доступна Вам на неконфиденциальной основе
      от лица (иного, нежели Компания или её Представители), которое, насколько
      Вам известно, не связано иным соглашением о конфиденциальности с Компанией
      или её Представителями, или не лишено права передавать Вам такую информацию
      в силу закона, договорного обязательства, фидуциарной обязанности или
      иным образом.


      [evidence_7] Независимо от вышеизложенного, | (i) Вы и Ваши Представители
      не обязаны удалять, стирать или уничтожать какой-либо Оценочный Материал,
      содержащийся в архивной системе автоматического резервного копирования,
      хранящейся в результате автоматических процедур резервного копирования
      (при этом Вы и Ваши Представители не будете получать доступ к таким архивным
      компьютерным файлам, содержащим такой Оценочный Материал, после того
      как такая передача или уничтожение иным образом требуется), и | (ii)
      Вы и/или Ваши Представители вправе сохранить одну копию Оценочного Материала
      (и можете получать доступ к такому Оценочному Материалу) в той мере и
      в течение того времени, в котором такое сохранение и доступ со стороны
      Вас или такого Представителя, в зависимости от обстоятельств, требуются
      в силу закона или нормативного акта; при условии, однако, что в случае
      каждого из пунктов | (i) и | (ii) настоящего предложения, независимо
      от любого иного положения настоящего Соглашения, Вы и соответствующие
      Ваши Представители продолжаете оставаться связанными условиями настоящего
      Соглашения, как если бы оно действовало в полную силу в отношении любого
      такого Оценочного Материала, до тех пор пока Вы или Ваши соответствующие
      Представители сохраняют любой такой Оценочный Материал.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Компания A и Компания B заключают соглашение о конфиденциальности в отношении
      обмена конфиденциальной коммерческой информацией, определяемой как «Оценочный
      Материал». По условиям соглашения Компания A обязана удалить весь Оценочный
      Материал после прекращения соглашения, за исключением двух конкретных
      исключений, изложенных в регулирующих условиях. После прекращения соглашения
      Компания A направляет Компании B электронное письмо с подтверждением того,
      что весь Оценочный Материал удалён, за исключением одной копии, сохранённой
      в зашифрованном архиве в силу автоматических процедур резервного копирования
      (Условие 1), и другой копии, сохранённой для соблюдения регуляторного
      требования о хранении записей в течение семи лет (Условие 2). Тем не менее,
      во время планового обновления ИТ-системы ИТ-команда Компании A обнаруживает
      папку, содержащую Оценочный Материал, который был случайно исключён из
      системы автоматического резервного копирования. Считая, что этот материал
      подпадает под исключение «получения на неконфиденциальной основе» (Исключение
      evidence_12), ИТ-команда перемещает папку на общий сетевой диск для проверки
      и классификации. Этот общий диск впоследствии используется младшим сотрудником,
      который применяет Оценочный Материал в презентации для несвязанного внутреннего
      проекта. Презентация выявляется в ходе внутренней проверки, и Компания
      B уведомляется. Компания B обвиняет Компанию A в нарушении соглашения
      в связи с неудалением Оценочного Материала и неправомерным доступом к
      нему. Компания A защищает свои действия, заявляя, что материал был исключён
      из удаления, поскольку считалось, что он подпадает под исключение «получения
      на неконфиденциальной основе», так как был получен от стороннего поставщика,
      не связанного обязательствами о конфиденциальности. Компания A представляет
      документацию, подтверждающую неконфиденциальный статус поставщика, и
      утверждает, что доступ к материалу был осуществлён исключительно для целей
      классификации во время ИТ-обновления.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
