id: ace_0012
benchmark: conformance
ruleset: ace-0012
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 12
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_11] В соответствии с условиями настоящего Соглашения Поставщик
      Приложения настоящим предоставляет Excite@Home безвозмездную, неисключительную,
      всемирную лицензию на использование, воспроизведение, распространение,
      передачу и публичный показ Контента e-centives в соответствии с настоящим
      Соглашением, а также на сублицензирование Контента Приложения полностью
      принадлежащим Excite@Home дочерним компаниям или совместным предприятиям,
      в которых Excite@Home участвует, исключительно в целях использования,
      воспроизведения, распространения, передачи и публичного показа Контента
      e-centives в соответствии с настоящим Соглашением, при условии, что такое
      сублицензирование не осуществляется в пользу Указанных конкурентов Поставщика
      Приложения.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Excite@Home заключило лицензионное соглашение с Поставщиком Приложения,
      предоставляющее ему безвозмездную, неисключительную лицензию на использование
      и сублицензирование Контента e-centives в пользу своих полностью принадлежащих
      дочерних компаний или совместных предприятий, при условии, что сублицензирование
      не осуществляется в пользу Указанных конкурентов. В данном случае Excite@Home
      сублицензировало Контент e-centives совместному предприятию (JV), в котором
      оно владело 40-процентной долей. Совместное предприятие, стремясь расширить
      охват, вступило в стратегическое партнёрство со сторонним дистрибьютором.
      Впоследствии выяснилось, что этот дистрибьютор действовал как полностью
      принадлежащая дочерняя компания Указанного конкурента Поставщика Приложения.
      Чтобы обосновать своё решение, Excite@Home сослалось на договорное толкование,
      согласно которому «запрет сублицензирования» применяется лишь к прямому
      сублицензированию со стороны самого Excite@Home, а не к сублицензированию,
      опосредованно осуществлённому через совместное предприятие или его последующие
      договорённости. Ситуация дополнительно осложняется тем, что Excite@Home
      зафиксировало условия сублицензионной договорённости в ходе неформальной
      устной встречи с партнёрами по JV, вместо того чтобы оформить их в виде
      письменного сообщения Поставщику Приложения. При проверке соответствия
      Excite@Home заявило, что решение JV о партнёрстве со сторонним дистрибьютором
      было операционно независимым и выходило за рамки прямого контроля Excite@Home.
      Однако внутренние электронные записи впоследствии показали, что Excite@Home
      было уведомлено о принадлежности дистрибьютора Указанному конкуренту до
      одобрения сублицензионной договорённости JV. Поставщик Приложения впоследствии
      квалифицировал это как нарушение условия «запрета сублицензирования в пользу
      Указанных конкурентов», утверждая, что Excite@Home не выполнило условия
      и положения лицензионного соглашения.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
