id: ace_0021
benchmark: conformance
ruleset: ace-0021
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 21
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_10] Если Получающая Сторона является компанией, Получающая Сторона
      вправе раскрывать Конфиденциальную Информацию | (i) директорам, должностным
      лицам и работникам Получающей Стороны (совместно именуемым «Представители»),
      в каждом случае лишь в объёме, разумно необходимом для внутреннего использования
      Получающей Стороной, и только после информирования каждого Представителя
      об ограничениях по настоящему Соглашению на раскрытие и использование Конфиденциальной
      Информации и о том, что он обязан соблюдать такие ограничения, и | Получающая
      Сторона вправе раскрывать CEII | (i) только тем своим Представителям,
      которые надлежащим образом подписали индивидуальные соглашения о неразглашении
      или конфиденциальности в рамках своей трудовой деятельности, специально
      относящиеся к конфиденциальной информации и CEII, которые они получают
      в ходе своей трудовой деятельности.


      [evidence_7] Если Получающая Сторона является компанией, Получающая Сторона
      вправе раскрывать Конфиденциальную Информацию | (i) директорам, должностным
      лицам и работникам Получающей Стороны (совместно именуемым «Представители»),
      в каждом случае лишь в объёме, разумно необходимом для внутреннего использования
      Получающей Стороной, и только после информирования каждого Представителя
      об ограничениях по настоящему Соглашению на раскрытие и использование Конфиденциальной
      Информации и о том, что он обязан соблюдать такие ограничения, и | (ii)
      любому иному лицу или организации только с предварительного письменного
      согласия Раскрывающих Сторон в каждом конкретном случае. | Получающая Сторона
      обязуется сохранять всю Конфиденциальную Информацию в строгой конфиденциальности
      и обязуется без предварительного письменного согласия соответствующей
      Раскрывающей Стороны в каждом конкретном случае не раскрывать Конфиденциальную
      Информацию или любые отчёты, результаты работ или иные документы, содержащие
      Конфиденциальную Информацию, любому третьему лицу, фирме, корпорации или
      организации. | Получающая Сторона обязуется без предварительного письменного
      согласия соответствующей Раскрывающей Стороны в каждом конкретном случае
      не раскрывать CEII или любые отчёты, результаты работ или иные документы,
      содержащие CEII, любому третьему лицу, фирме, корпорации или организации.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Получающая Сторона — технологическая компания среднего размера — заключает
      соглашение о конфиденциальности с Раскрывающей Стороной — крупной многонациональной
      корпорацией — для оценки потенциального партнёрства. В рамках соглашения
      Получающая Сторона получает доступ к конфиденциальной технической документации,
      классифицированной как Конфиденциальная Информация и Информация о Критической
      Энергетической Инфраструктуре (CEII). Для проведения внутреннего анализа
      Получающая Сторона передаёт документацию своей инженерной команде. Однако
      вместо того чтобы распространять документы через безопасную внутреннюю
      систему обмена файлами компании, руководитель проекта Получающей Стороны
      загружает файлы в личную, защищённую паролем папку Google Drive и рассылает
      ссылки доступа команде через сообщение в Slack. Руководитель проекта
      включает в сообщение в Slack напоминание о том, что документы являются
      конфиденциальными и подпадают под ограничения, изложенные в соглашении.
      Дополнительно, каждый член команды ранее подписал индивидуальные соглашения
      о неразглашении (NDA) в рамках своих трудовых договоров, которые прямо
      охватывают CEII и иную конфиденциальную информацию. Раскрывающая Сторона
      впоследствии обнаруживает использование Google Drive и Slack и выражает
      опасения о возможных нарушениях соглашения о конфиденциальности, утверждая,
      что эти способы распространения являются неформальными и небезопасными.
      Получающая Сторона защищает свои действия, утверждая, что распространение
      было ограничено её Представителями, было разумно необходимо для внутреннего
      использования, и что все Представители были проинформированы об ограничениях
      конфиденциальности, как требуется соглашением.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
