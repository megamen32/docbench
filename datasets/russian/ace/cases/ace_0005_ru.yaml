id: ace_0005
benchmark: conformance
ruleset: ace-0005
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 5
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_1] Если настоящее Соглашение продлевается на Первый Дополнительный
      Срок, то Первый Дополнительный Срок начинается 23 июля 2016 года, и
      Соглашение автоматически истекает и прекращается без дополнительного уведомления
      22 июля 2019 года. | Если настоящее Соглашение продлевается на Второй
      Дополнительный Срок, то Второй Дополнительный Срок начинается 23 июля
      2019 года и Соглашение автоматически истекает и прекращается без дополнительного
      уведомления 22 июля 2022 года. | В случае если MusclePharm достигнет совокупного
      объёма Чистых Продаж (как определено ниже) в размере 20 миллионов долларов
      США (далее — «Первый Порог Продления») в течение Третьего Года Действия
      Договора, настоящее Соглашение автоматически продлевается на дополнительный
      срок три (3) года (далее — «Первый Дополнительный Срок») на тех же
      условиях, что и Начальный Срок, за исключением того, что: (i) никакое
      дополнительное Вознаграждение Акциями (как определено ниже) не выпускается
      в связи с продлённым Сроком; (ii) Денежное Вознаграждение за Первый
      Дополнительный Срок устанавливается согласно Разделу 7 и Разделу (2)
      Приложения «C», прилагаемому к настоящему Соглашению; (iii) Контрактор
      обязуется провести только два (2) Появления в каждом Году Действия Договора
      в течение Первого Дополнительного Срока в соответствии с пунктом 4(a)(ii)
      ниже; и (iv) маркетинговый бюджет на продвижение Лицензированных Продуктов
      составляет 5,0 миллиона долларов в течение каждого Года Действия Договора
      Первого Дополнительного Срока (с учётом пункта 12(b) настоящего Соглашения).
      | В случае если MusclePharm достигнет объёма Чистых Продаж в размере
      50 миллионов долларов (далее — «Второй Порог Продления») совокупно в
      течение шестого Года Действия Договора, настоящее Соглашение автоматически
      продлевается на дополнительный срок три (3) года (далее — «Второй Дополнительный
      Срок») на тех же условиях, что и начальный Срок, за исключением того,
      что: (i) никакое дополнительное Вознаграждение Акциями не выпускается
      в связи с продлённым Сроком; (ii) Денежное Вознаграждение за продлённый
      Срок устанавливается согласно Разделу 7 и Разделу (3) Приложения «C»;
      (iii) Контрактор проводит только два (2) Появления в каждом Году Действия
      Договора в течение Второго Дополнительного Срока в соответствии с пунктом
      4(a)(ii) ниже; и (iv) маркетинговый бюджет на продвижение Лицензированных
      Продуктов составляет 5,0 миллиона долларов в каждом Году Действия Договора
      Второго Дополнительного Срока (с учётом пункта 12(b) настоящего Соглашения).


      [evidence_3] Независимо от вышеизложенного, нижеследующее не будет считаться
      нарушением настоящего Соглашения: (i) исполнение Контрактором услуг или
      появление в новостной или информационной части любой радио-, телевизионной
      или кинематографической программы или развлекательной передачи вне зависимости
      от представленных в ней продуктов или услуг или их спонсорства; (ii)
      участие Контрактора в кинофильмах или телевизионных программах, а также
      в мерчандайзинге, коммерческих кросс-промо и/или продакт-плейсменте с
      использованием Контрактора, либо (iii) исполнение Контрактором услуг,
      появление или использование его имени и изображения в связи с благотворительными
      мероприятиями, спортивными событиями, организациями, вне зависимости
      от использования продуктов или услуг и/или их спонсорства. | Независимо
      от вышеизложенного или любого иного содержания настоящего Соглашения,
      настоящее Соглашение не препятствует и никоим образом не ограничивает
      Контрактора в рекламе, маркетинге и/или поддержке продуктов (или иных
      компаний, производящих такие продукты), в которых случайно содержатся
      пищевые добавки (включая, без ограничения, протеины, витамины, минералы,
      аминокислоты, травы, легальные вещества, повышающие работоспособность),
      при условии, что основная цель такого продукта или компании не состоит
      в продаже или продвижении пищевой добавки.


      [evidence_5] Независимо от вышеизложенного, настоящее Соглашение может
      быть уступлено без согласия Сторон MusclePharm в связи со сделкой по
      смене контроля; при условии, что приобретатель MusclePharm обладает финансовыми
      ресурсами, существенно аналогичными или превосходящими ресурсы MusclePharm,
      и в письменной форме примет на себя обязательства MusclePharm по настоящему
      Соглашению до завершения сделки по смене контроля. | Ни одна из сторон
      не вправе добровольно или в силу закона уступать или иным образом передавать
      права и/или обязанности, принятые по условиям настоящего Соглашения,
      без предварительного письменного согласия другой стороны.


      [evidence_7] Независимо от вышеизложенного, Займодатель имеет право на получение
      гарантированного минимального роялти за каждый Год Действия Договора,
      включая Дополнительный Срок, при наличии (далее — «Гарантированное Минимальное
      Роялти»), выплачиваемого в соответствии с Приложением «C» к настоящему
      Соглашению. | Гарантированное Минимальное Роялти в течение Первого Дополнительного
      Срока: В случае если Порог Продления достигнут в Третьем Году Действия
      Договора, в течение Первого Дополнительного Срока Минимальное Роялти
      и Сроки Выплат устанавливаются следующим образом: Год Действия Договора
      Минимальное Роялти Срок Выплаты Четвёртый 2 500 000 долларов США 833 333,33
      доллара США выплата в следующие даты: 23 июля 2016 года; 1 октября 2016
      года; 1 февраля 2017 года Пятый 2 500 000 долларов США 833 333,33 доллара
      США выплата в следующие даты: 23 июля 2017 года; 1 октября 2017 года;
      1 февраля 2018 года Шестой 2 500 000 долларов США 833 333,33 доллара США
      выплата в следующие даты: 23 июля 2018 года; 1 октября 2018 года; 1 февраля
      2019 года | Гарантированное Минимальное Роялти в течение Второго Дополнительного
      Срока: В случае если Второй Порог Продления достигнут в Шестом Году
      Действия Договора, в течение Второго Дополнительного Срока Минимальное
      Роялти и Сроки Выплат устанавливаются следующим образом: Год Действия
      Договора Минимальное Роялти Срок Выплаты Седьмой 5 000 000 долларов США
      1 666 666,66 доллара США выплата в следующие даты: 23 июля 2019 года;
      1 октября 2019 года; 1 февраля 2020 года Восьмой 5 000 000 долларов США
      1 666 666,66 доллара США выплата в следующие даты: 23 июля 2020 года;
      1 октября 2020 года; 1 февраля 2021 года Девятый 5 000 000 долларов
      США 1 666 666,66 доллара США выплата в следующие даты: 23 июля 2021 года;
      1 октября 2021 года; 1 февраля 2022 года | Контрактор также обязуется
      поставлять MusclePharm не менее пятидесяти (50) подписанных предметов
      за каждый Год Действия Договора, на Лицензированных Продуктах или на
      иных предметах, согласованных сторонами, для использования MusclePharm
      в связи с продвижением Продуктов и/или Лицензированных Продуктов. |
      Гарантированное Минимальное Роялти в течение начального Срока: Год Действия
      Договора Минимальное Роялти Срок Выплаты Первый 1 500 000 долларов США
      500 000 долларов США выплата в следующие даты: 23 июля 2013 года; 1 октября
      2013 года; 1 февраля 2014 года Второй 2 000 000 долларов США 666 666,66
      доллара США выплата в следующие даты: 23 июля 2014 года; 1 октября 2014
      года; 1 февраля 2015 года Третий 2 500 000 долларов США 833 333,33 доллара
      США выплата в следующие даты: 23 июля 2015 года; 1 октября 2015 года;
      1 февраля 2016 года.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      MusclePharm, столкнувшись с финансовыми ограничениями в последние годы
      действия своего соглашения с Займодателем, решает исполнить своё обязательство
      по поставке подписанных предметов «в связи с» продвижением Лицензированных
      Продуктов необычным способом. Вместо заказа новых предметов для подписания
      MusclePharm использует оставшуюся продукцию предыдущих рекламных кампаний
      для выполнения квоты в пятьдесят (50) подписанных предметов в Год Действия
      Договора. Переработанные предметы, включая устаревшие рекламные листовки
      и брендированные шейкеры для протеина с прошлых маркетинговых мероприятий,
      распространяются вместе с текущими Лицензированными Продуктами. Дополнительно,
      MusclePharm обеспечивает выплату лицензионных платежей, указанных в Приложении
      «C», точно в установленные сроки и в установленных суммах. Тем не менее,
      распространение устаревшей продукции создаёт видимость несоблюдения или
      потенциального нарушения, поскольку рекламные предметы кажутся не связанными
      с текущими маркетинговыми усилиями. Это решение вызывает критику со стороны
      Займодателя, который ставит под вопрос, выполняют ли подписанные предметы
      цель соответствующего условия. Несмотря на спор, MusclePharm утверждает,
      что подписанные предметы по-прежнему служат «в связи с» продвижением
      Лицензированных Продуктов, как требуется соглашением. Компания подчёркивает,
      что условие не определяет характер, качество или дату изготовления подписанных
      предметов, а лишь требует, чтобы они были подписаны и использовались для
      продвижения. MusclePharm представляет документацию, демонстрирующую, что
      переработанные предметы действительно распространялись вместе с Лицензированными
      Продуктами в рекламных кампаниях, представляя доказательства формального
      соответствия.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
