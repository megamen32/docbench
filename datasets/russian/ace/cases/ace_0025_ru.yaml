id: ace_0025
benchmark: conformance
ruleset: ace-0025
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 25
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_6] Если Tripath расторгает Соглашение в соответствии с пунктами
      18.1 или 18.2, либо если Дистрибьютор расторгает Соглашение в соответствии
      с пунктом 18.3, Tripath обязуется приобрести, а Дистрибьютор обязуется перепродать
      Tripath оставшиеся у Дистрибьютора запасы Продуктов (за исключением снятых
      с производства и демонстрационных Продуктов согласно Дистрибьюторскому
      Соглашению), которые Tripath признает неповреждёнными и в хорошем состоянии
      (включая, по выбору Tripath, осмотр на месте). Цена таких запасов равна
      цене, фактически уплаченной Дистрибьютором, за вычетом ранее предоставленных
      скидок или иных уступок. | Если Дистрибьютор расторгает Соглашение в
      соответствии с пунктами 18.1 или 18.2, либо если Tripath расторгает
      Соглашение в соответствии с пунктом 18.3, Tripath вправе по своему выбору
      приобрести, а Дистрибьютор обязуется перепродать Tripath все или часть
      запасов Дистрибьютора по цене, указанной в пункте 18.4, за вычетом десятипроцентной
      стоимости обратной приёмки. | После прекращения настоящего Соглашения
      Дистрибьютор незамедлительно прекращает любое дальнейшее использование
      товарных знаков, торговых наименований или знаков обслуживания Tripath,
      за исключением случаев, когда это требуется для продажи Продуктов из
      запасов.


      [evidence_7] Вышеизложенные положения настоящего раздела 19 устанавливают полную
      ответственность и обязательства Tripath и исключительное средство правовой
      защиты Дистрибьютора и его клиентов в отношении любого фактического или
      предполагаемого нарушения прав интеллектуальной собственности в отношении
      Продуктов. | Ни Tripath, ни Дистрибьютор не несут ответственности за какие-либо
      побочные или косвенные убытки (включая, без ограничения, убытки в виде
      потери коммерческой прибыли, перерыва в коммерческой деятельности, потери
      деловой информации или иного имущественного ущерба), вытекающие из настоящего
      Соглашения, даже если им было сообщено о возможности таких убытков.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Tripath и Дистрибьютор приближаются к концу действия своего соглашения, и
      Дистрибьютор решает расторгнуть соглашение в соответствии с пунктом 18.3.
      В соответствии с регулирующими условиями, Дистрибьютор обязан перепродать
      свои запасы Tripath, при условии, что запасы являются неповреждёнными и
      находятся в хорошем состоянии. Tripath проводит осмотр на месте и определяет,
      что 85% запасов соответствуют условиям для покупки. Однако Tripath также
      отмечает, что часть запасов включает снятые с производства Продукты, которые
      прямо исключены из обязательства. Tripath сообщает об этом определении
      Дистрибьютору необычным способом — комментарием в совместном документе
      на облачной платформе, с указанием того, какие товарные позиции исключены
      по категории «снятое с производства». Дистрибьютор, восприняв это как
      неформальное и недостаточное сообщение, первоначально заявляет о несоответствии,
      утверждая, что такое сообщение не соответствует стандарту «письменного
      уведомления». Тем не менее, Дистрибьютор продолжает перепродавать соответствующие
      запасы по указанной цене, за вычетом ранее предоставленных скидок или иных
      уступок. Дополнительно, Дистрибьютор также выражает опасения в связи с
      отказом Tripath приобрести некоторые демонстрационные Продукты, несмотря на
      их исключение по условию. Дополнительно, Tripath пользуется своим правом
      применить десятипроцентную стоимость обратной приёмки к части запасов, что
      вызывает дальнейшие разногласия. Ситуация выглядит сомнительной из-за неформального
      канала коммуникации, использованного Tripath, и множественных вычетов, применённых
      во время сделки, создавая впечатление несоответствия или недобросовестных
      действий. Однако все действия, предпринятые Tripath, строго соответствуют
      букве соглашения.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
