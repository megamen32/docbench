documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 19
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_7] Не ограничивая какие-либо обязательства или ответственность
      Подрядчика, вытекающие из настоящего Соглашения или из закона, с учётом
      любых ограничений по настоящему Соглашению, Подрядчик обязан поддерживать,
      а также обязывать любых привлечённых им субподрядчиков, оказывающих услуги
      по настоящему Соглашению, поддерживать за свой счёт в течение срока действия
      настоящего Соглашения страховые полисы видов и в пределах, указанных в
      ПРИЛОЖЕНИИ D к настоящему Соглашению. Расходы по такому страхованию несёт
      Подрядчик. Подрядчик обязан поддерживать в силе полисы, указанные в разделах
      1 и 3 Страхового Сертификата, до тех пор, пока юридическая ответственность
      Подрядчика СУЩЕСТВУЕТ В СВЯЗИ С ОПЕРАЦИЯМИ ПО НАСТОЯЩЕМУ СОГЛАШЕНИЮ.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Подрядчик, как предусмотрено соглашением, обязан поддерживать страховые
      полисы, указанные в ПРИЛОЖЕНИИ D, в течение срока действия контракта и
      до тех пор, пока существует его юридическая ответственность в связи с
      операциями по соглашению. Однако уведомление Подрядчика о продлении страхования
      было направлено контрагенту необычным способом: в виде комментария в общем
      документе управления проектом, а не в виде официального письменного уведомления.
      Этот комментарий, встроенный в обновление задачи, гласил: «Страховые полисы
      продлены, как требуется по ПРИЛОЖЕНИЮ D. Действительны до [дата продления]».
      Этот необычный подход вызвал опасения относительно профессионализма и
      формальной действительности. Дополнительно, страховые полисы, поддерживаемые
      Подрядчиком, прямо покрывали операции по соглашению, но исключали покрытие
      субподрядчиков, которые были застрахованы по отдельным полисам, оформленным
      непосредственно каждым субподрядчиком. Этот выбор раздельного страхового
      покрытия, хотя и технически соответствовал требованиям, поначалу казался
      сомнительным, поскольку отступал от отраслевой практики, где субподрядчики
      обычно покрываются единым страховым полисом, оформляемым основным подрядчиком.
      Несмотря на эти опасения, Подрядчик обеспечил, чтобы все субподрядчики
      поддерживали страховые полисы, соответствующие пределам и видам, указанным
      в ПРИЛОЖЕНИИ D. Вся документация по полисам как Подрядчика, так и субподрядчиков
      была доступна и действительна в течение соответствующего периода.'
expected_findings: []
expected_disposition: accept
