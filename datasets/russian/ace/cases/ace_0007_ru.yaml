id: ace_0007
benchmark: conformance
ruleset: ace-0007
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 7
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_4] В течение Срока, в отношении деятельности, описанной в настоящем
      Соглашении, IMNTV настоящим предоставляет Дистрибьютору неисключительные
      права и лицензии, необходимые в пределах Территории, на: (a) копирование,
      хранение в цифровой форме, размещение и потоковую передачу Программирования;
      (b) публичное исполнение, публичный показ, электронную передачу, распространение
      и трансляцию Программирования; (c) продвижение Программирования и использование
      Знаков IMNTV для целей продвижения Дистрибьютором Программирования в рамках
      деятельности, описанной в пункте 2.4 выше; (d) архивирование Программирования
      на серверах Дистрибьютора; (e) кодирование, копирование и создание непрерывных
      отрывков Программирования длительностью до шестидесяти (60) секунд, а также
      передачу, публичное исполнение, распространение и перераспределение таких
      отрывков.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      IMNTV заключает соглашение с Дистрибьютором, предоставляя конкретные неисключительные
      права на работу с её Программированием в течение Срока. Во втором квартале
      Срока Дистрибьютор решает продвигать Программирование, создавая 60-секундный
      рекламный монтаж и размещая его на популярной платформе социальных сетей.
      Хотя это соответствует пункту (e), разрешающему создание и передачу отрывков
      длительностью до шестидесяти (60) секунд, рекламное видео также содержит
      наложенный логотип стороннего спонсора — компании электронной коммерции.
      Спонсор не упоминается в Соглашении, но Дистрибьютор утверждает, что
      участие спонсора было необходимым для покрытия рекламных расходов и повышения
      охвата. Публикация в социальных сетях также содержит неформальные формулировки,
      включая эмодзи и хэштеги, что некоторые руководители IMNTV сочли непрофессиональным
      и потенциально вредным для их бренда. IMNTV выражает опасения, что использование
      логотипа третьего лица и неформальный тон нарушают дух Соглашения, в частности
      подразумеваемый стандарт профессионализма при использовании Знаков IMNTV.
      Дистрибьютор настаивает, что действовал в рамках своих прав, поскольку Соглашение
      прямо разрешает продвижение Программирования и использование Знаков IMNTV
      для этой цели, без ограничений в отношении участия третьих лиц или тона
      коммуникации.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
