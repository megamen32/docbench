id: ace_0026
benchmark: conformance
ruleset: ace-0026
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 26
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_4] обязательства передающей Стороны в письменном инструменте, копия которого
      предоставляется другой Стороне; и (ii) любая уступка настоящего Соглашения
      должна сопровождаться одновременной уступкой Иных Соглашений тому же правопреемнику,
      а также интереса передающей Стороны в Приобретённых Активах тому же правопреемнику,
      если только Conformis заранее не согласится на иное, и такое согласие не
      может быть неразумно задержано. | За исключением случаев, предусмотренных
      настоящим Соглашением, ни одна из Сторон не вправе уступать какие-либо свои
      права или обязанности по настоящему Соглашению (путём слияния, продажи акций
      или иным образом) без предварительного письменного согласия другой Стороны;
      однако, любой из Сторон разрешается без необходимости получения согласия
      другой Стороны уступить настоящее Соглашение: (a) полностью или частично
      Аффилированному лицу (при условии, что после того как такое лицо перестаёт
      быть Аффилированным лицом передающей Стороны, такое бывшее Аффилированное
      лицо обязуется обратно уступить настоящее Соглашение передающей Стороне),
      при условии, что передающая Сторона уведомляет другую Сторону о любой
      такой уступке, и при этом, далее, если уведомление о такой уступке не
      предоставлено, это не делает такую уступку недействительной; либо (b) Третьему
      Лицу в связи с продажей или передачей всех или почти всех активов передающей
      Стороны, относящихся к предмету настоящего Соглашения, вне зависимости
      от того, происходит ли это путём Смены Контроля, слияния, продажи активов
      или иным образом; при условии, однако, что в отношении пункта (b): (i) любая
      уступка настоящего Соглашения является ничтожной и не имеет силы до тех
      пор, пока и если только правопреемник не примет на себя


      [evidence_5] передающей Стороны в письменном инструменте, копия которого
      предоставляется другой Стороне; и (ii) любая уступка настоящего Соглашения
      должна сопровождаться одновременной уступкой Иных Соглашений тому же правопреемнику,
      а также интереса передающей Стороны в Приобретённых Активах тому же правопреемнику,
      если только Conformis заранее не согласится на иное, и такое согласие
      не может быть неразумно задержано. | Любая уступка, не соответствующая
      настоящему пункту 10.2, является ничтожной. | В той мере, в которой сотрудничество
      с Агентами или иными Третьими Лицами допускается в соответствии с Планом
      НИОКР, если какой-либо Стороне необходимо привлечь Агента или иное Третье
      Лицо в связи с Планом НИОКР или любой иной работой по настоящему Соглашению,
      такая Сторона обязана заранее получить от этого Агента или иного Третьего
      Лица письменное согласие: (i) на передачу Стороне всех Изобретений, задуманных,
      созданных или разработанных Агентом или иным Третьим Лицом, и (ii) на
      сохранение всей Конфиденциальной Информации в тайне, как предусмотрено
      пунктом 5.2. | За исключением случаев, предусмотренных настоящим Соглашением,
      ни одна из Сторон не вправе уступать какие-либо свои права или обязанности
      по настоящему Соглашению (путём слияния, продажи акций или иным образом)
      без предварительного письменного согласия другой Стороны; однако, любой
      из Сторон разрешается без необходимости получения согласия другой Стороны
      уступить настоящее Соглашение: (a) полностью или частично Аффилированному
      лицу (при условии, что после того как такое лицо перестаёт быть Аффилированным
      лицом передающей Стороны, такое бывшее Аффилированное лицо обязуется обратно
      уступить настоящее Соглашение передающей Стороне), при условии, что передающая
      Сторона уведомляет другую Сторону о любой такой уступке, и при этом, далее,
      если уведомление о такой уступке не предоставлено, это не делает такую
      уступку недействительной; либо (b) Третьему Лицу в связи с продажей или
      передачей всех или почти всех активов передающей Стороны, относящихся к
      предмету настоящего Соглашения, вне зависимости от того, происходит ли
      это путём Смены Контроля, слияния, продажи активов или иным образом;
      при условии, однако, что в отношении пункта (b): (i) любая уступка настоящего
      Соглашения является ничтожной и не имеет силы до тех пор, пока и если только
      правопреемник не примет на себя


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Сторона A, биотехнологическая компания, участвует в сложном Плане НИОКР со
      Стороной B, фармацевтической корпорацией, в рамках многоуровневого соглашения.
      Чтобы ускорить сроки своих исследований, Сторона A решает привлечь Агента
      (специализированного исследовательского подрядчика) для разработки новых
      молекулярных соединений. Признавая договорное требование о предварительных
      письменных соглашениях, Сторона A составляет контракт с Агентом, который
      включает положения о: (i) уступке всех Изобретений, созданных Агентом,
      Стороне A, и (ii) сохранении всей Конфиденциальной Информации в тайне.
      Однако вместо получения предварительного письменного согласия Стороны B
      или направления явного предварительного уведомления о привлечении Агента,
      Сторона A решает опереться на сформулированное широко условие из отдельного
      раздела соглашения, разрешающее «рутинную деятельность с участием одобренных
      Третьих Лиц» без формального уведомления. Сторона A толкует это условие
      как подразумевающее охват привлечения Агента, утверждая, что деятельность
      Агента является рутинной и подпадает под рамки Плана НИОКР. Сторона A приступает
      к финализации контракта с Агентом и началу исследовательской деятельности,
      считая свои действия соответствующими на основании такого толкования. Несколько
      недель спустя Сторона B обнаруживает привлечение Агента при плановой проверке
      проекта и выражает опасения относительно отсутствия формального уведомления
      и согласия, ссылаясь на явные требования пункта 10.2 относительно уступок
      и привлечения Третьих Лиц. Сторона A защищает свои действия, настаивая,
      что деятельность Агента была рутинной и потому освобождалась от более
      строгих процедурных требований по пункту 10.2. Сторона B возражает, что
      регулирующее условие прямо требует предварительных письменных соглашений
      и уведомлений для любого участия Третьего Лица в Плане НИОКР, и что ссылка
      на отдельное условие не отменяет этой обязанности.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
