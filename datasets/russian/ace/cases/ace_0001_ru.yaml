id: ace_0001
benchmark: conformance
ruleset: ace-0001
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 1
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_5] На Срок Лицензии и в пределах Лицензионной Территории Продюсер
      настоящим предоставляет ConvergTV право и лицензию на Распространение программы,
      файла или видеозаписи, указанных в Условиях Сделки выше (далее — «Программа»),
      состоящей из | эпизодов (серий) или | Срок Лицензии — Бессрочный, неограниченное
      количество показов × Иное: 2 года, начиная с 15 ноября 2012 года | Продюсер
      также предоставляет ConvergTV право и лицензию на Распространение Программы
      на любом канале ConvergTV и/или на любых иных каналах распространения, существующих
      в настоящий момент или созданных или разработанных в будущем, и это право
      включает право на Распространение на любых каналах аффилированного лица ConvergTV
      и/или на любых иных каналах распространения без ограничений. | Разовые произведения,
      на неограниченное количество показов в течение Срока Лицензии через каналы
      ConvergTV и/или иные каналы распространения, в соответствии с Лицензионными
      Правами.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      ConvergTV заключила с Продюсером лицензионное соглашение, предоставив ConvergTV
      право на распространение конкретной Программы в пределах Лицензионной Территории
      на Срок Лицензии. Программа являлась разовым произведением со Сроком Лицензии
      два года, начиная с 15 ноября 2012 года. ConvergTV распространяла Программу
      на своей недавно запущенной стриминговой платформе StreamSphere, которая
      не существовала на момент подписания соглашения, но прямо предусматривалась
      оговоркой, разрешающей распространение на «каналах распространения, существующих
      в настоящий момент или созданных или разработанных в будущем». Однако ConvergTV
      не сделала заметного объявления о доступности Программы на StreamSphere
      для Продюсера, а также не разместила Программу на главной странице StreamSphere,
      поместив её вместо этого в менее посещаемый раздел «Архивные программы».
      Дополнительно, неформальное электронное письмо от контент-менеджера ConvergTV
      к Продюсеру упомянуло о размещении, но было сформулировано неоднозначно:
      «Программа доступна где-то на StreamSphere. Если есть вопросы — дайте знать».
      Позднее Продюсер раскритиковал ConvergTV, заявив, что она не обеспечила
      «значимого» распространения Программы, поскольку её размещение в разделе «Архивные
      программы» делало маловероятным привлечение существенного количества зрителей.
      Продюсер далее утверждал, что неформальное электронное сообщение о статусе
      распространения являлось ненадлежащим уведомлением в соответствии с условиями
      контракта. Несмотря на эти претензии, ConvergTV настаивала на том, что её
      действия соответствовали буквальным условиям соглашения, поскольку она распространяла
      Программу в пределах Лицензионной Территории и в течение Срока Лицензии,
      на канале, подпадающем под действие оговорок соглашения о будущих каналах
      распространения.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
