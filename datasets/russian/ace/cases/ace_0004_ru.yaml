id: ace_0004
benchmark: conformance
ruleset: ace-0004
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 4
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_9] В соответствии с условиями настоящего Соглашения Поставщик
      Приложения настоящим предоставляет Excite@Home безвозмездную, неисключительную,
      всемирную лицензию на использование, воспроизведение, распространение,
      передачу и публичный показ Контента e-centives в соответствии с настоящим
      Соглашением, а также на сублицензирование Контента Приложения полностью
      принадлежащим Excite@Home дочерним компаниям или совместным предприятиям,
      в которых Excite@Home участвует, исключительно в целях использования,
      воспроизведения, распространения, передачи и публичного показа Контента
      e-centives в соответствии с настоящим Соглашением, при условии, что такое
      сублицензирование не осуществляется в пользу Указанных конкурентов Поставщика
      Приложения. | Каждая сторона настоящим предоставляет другой стороне неисключительную,
      ограниченную лицензию на использование своих товарных знаков, знаков обслуживания
      или торговых наименований исключительно в порядке, конкретно описанном
      в настоящем Соглашении.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Excite@Home в рамках своего лицензионного соглашения с Поставщиком Приложения
      намеревалось сублицензировать Контент e-centives вновь созданному совместному
      предприятию Streamline Partners. Streamline Partners было создано как
      партнёрство с долями 70-30 между Excite@Home и сторонней фирмой EdgeCore
      Systems. Для закрепления договорённости Excite@Home направило Поставщику
      Приложения официальное уведомление по электронной почте с приложением
      подробного меморандума о структуре совместного предприятия и планируемом
      сублицензировании. В письме подчёркивалось, что EdgeCore Systems, являясь
      миноритарным партнёром, не будет иметь операционного контроля над сублицензированным
      контентом и не получит прямого доступа к нему или права его распространять.
      Несмотря на это заверение, Excite@Home явным образом не раскрыло того
      факта, что EdgeCore Systems является Указанным конкурентом в соответствии
      с определениями соглашения. Полагаясь на то, что миноритарная доля EdgeCore
      не давала ей полномочий по принятию решений в совместном предприятии,
      Excite@Home завершило оформление сублицензионной договорённости без
      получения предварительного письменного согласия Поставщика Приложения.
      Спустя несколько месяцев, при плановой проверке деятельности совместного
      предприятия, Поставщик Приложения обнаружил участие EdgeCore Systems
      и заявил возражения, ссылаясь на условие, запрещающее сублицензирование
      в пользу Указанных конкурентов. Excite@Home возражало, утверждая, что
      структура совместного предприятия исключала какой-либо конкурентный ущерб,
      поскольку EdgeCore Systems не контролировала Контент e-centives и не могла
      использовать его в конкурентных целях. Excite@Home далее указывало, что
      формулировка соглашения разрешает сублицензирование совместным предприятиям,
      «в которых Excite@Home участвует», без явного ограничения в отношении
      миноритарных участников, и что их уведомление удовлетворило требования
      соглашения.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
