ruleset: ace-0003
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 3
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_6] В тех странах, где для совместного правообладателя Совместного
      изобретения или Совместного улучшения требуется специальная лицензия для
      использования такого Совместного изобретения или Совместного улучшения,
      в такой стране каждая Сторона настоящим предоставляет другой Стороне
      бессрочную, безотзывную, неисключительную, всемирную, безвозмездную,
      полностью оплаченную лицензию, передаваемую и сублицензируемую, в пределах
      прав, правовых оснований и интересов такой Стороны в отношении такого
      Совместного изобретения или Совместного улучшения, на свободное использование
      такого Совместного изобретения или Совместного улучшения в такой стране
      в соответствии с условиями настоящего Соглашения и предоставленными по
      нему лицензиями. | В отношениях между Сторонами Стороны совместно владеют
      всеми Изобретениями (включая Улучшения), разработанными, созданными или
      реализованными совместно или от имени обеих Bioeq и Лицензиата (такие
      Изобретения — Совместные изобретения, и такие Улучшения — Совместные
      улучшения), а также всеми Правами интеллектуальной собственности и
      Ноу-хау в них. | Каждая Сторона настоящим уступает другой Стороне равную
      и неделимую долю во всех Совместных изобретениях (включая Совместные
      улучшения) для оформления такого совместного владения такими Совместными
      изобретениями (включая Совместные улучшения).


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Bioeq и Лицензиат совместно разработали новое фармацевтическое соединение,
      которое квалифицируется как Совместное улучшение по их соглашению. Для
      использования этого соединения в Стране X требуется специальная лицензия
      в силу местного законодательства об интеллектуальной собственности. Bioeq
      предоставляет Лицензиату требуемую безвозмездную лицензию, как это предусмотрено
      условием, необычным способом: вместо оформления формального письменного
      лицензионного соглашения Bioeq включает предоставление лицензии в общий
      цифровой документ совместной работы во время виртуального проектного совещания.
      Документ позднее аннотируется отметкой времени и сохраняется в общем
      облачном хранилище, доступном Лицензиату. Лицензиат принимает лицензию
      подразумеваемо, приступая к коммерциализации в Стране X. Однако во время
      аудита сторонний рецензент ставит под сомнение способ предоставления
      лицензии Bioeq, ссылаясь на отсутствие традиционного подписанного юридического
      документа. Bioeq защищает свой подход, утверждая, что условие не указывает
      форму предоставления лицензии, а лишь требует, чтобы лицензия была предоставлена
      и соответствовала указанным условиям. Дополнительно, обе стороны совместно
      владеют соединением и ранее уступали доли совместного владения, что дополнительно
      подтверждает допустимость предоставления лицензии.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
