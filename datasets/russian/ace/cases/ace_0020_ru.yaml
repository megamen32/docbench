id: ace_0020
benchmark: conformance
ruleset: ace-0020
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 20
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_5] Green Cross настоящим предоставляет MacroGenics безвозмездную,
      всемирную лицензию на Срок с правом выдачи сублицензий в рамках Лицензированных
      Патентов Green Cross и Ноу-хау Green Cross, включённых в любой Продукт,
      а также всей иной интеллектуальной собственности, контролируемой Green
      Cross, непосредственно относящейся к MGAH22, в объёме, необходимом MacroGenics
      для исследования, идентификации, разработки, производства, организации
      производства, использования, продажи, предложения к продаже и импорта
      Продуктов, включая, без ограничения указанным, как предусмотрено пунктом
      10.1(с) выше, во всех случаях без какой-либо обязанности получать предварительное
      согласие Green Cross. | безвозмездную лицензию с правом выдачи сублицензий
      на Срок на использование всех Клинических Данных и иных данных, сгенерированных
      MacroGenics в соответствии с исполнением ею своих обязанностей по настоящему
      Соглашению, в целях исполнения Green Cross своих обязанностей по настоящему
      Соглашению. | Green Cross вправе предоставлять сублицензиатам лицензии
      исключительно в целях исполнения своих обязательств по Разработке по
      настоящему Соглашению. | В соответствии с условиями настоящего Соглашения
      MacroGenics настоящим предоставляет Green Cross неисключительную, безвозмездную,
      бессрочную лицензию с правом выдачи и разрешения выдачи сублицензий на
      использование всех Клинических Данных и любых данных, сгенерированных
      Green Cross или любым из её представителей или независимых подрядчиков
      в соответствии с исполнением ею своих обязанностей по настоящему Соглашению,
      для исследования, Разработки, производства, Коммерциализации и продаж
      MGAH22 и Продуктов MacroGenics за пределами Территории, а также для осуществления
      MacroGenics своих прав и исполнения своих обязанностей по настоящему Соглашению.
      | В соответствии с условиями настоящего Соглашения MacroGenics настоящим
      предоставляет Green Cross исключительную, возмездную роялти (i) лицензию
      с правом выдачи сублицензий (с учётом пункта 10.1(b)) в рамках Лицензированной
      Технологии MacroGenics и Лицензированных Товарных Знаков MacroGenics; и
      (ii) в объёме, необходимом по настоящему пункту 10.1(a), сублицензию
      в рамках Лицензированной Технологии MacroGenics, лицензированной в соответствии
      с Восходящими Соглашениями, в каждом из случаев (i) и (ii) — для выполнения
      Плана Клинической Разработки Фазы I и Плана Клинической Разработки Фазы
      II, а также для распространения, продажи, предложения к продаже и импорта
      Продуктов в Области применения и на Территории в течение Срока.


      [evidence_6] Если Green Cross расторгает настоящее Соглашение в соответствии
      с пунктом 16.3: | (ii) Несмотря на любые противоречащие положения, MacroGenics
      обязуется продолжать предоставлять Green Cross, на срок до ***, Продукты
      (включая, без ограничения, весь MGAH22), по запросу Green Cross в соответствии
      с условиями пункта 6.2.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Green Cross и MacroGenics сотрудничали в рамках лицензионного соглашения по
      разработке и коммерциализации фармацевтического продукта MGAH22. По соглашению
      Green Cross предоставило MacroGenics безвозмездную всемирную лицензию на
      использование своей интеллектуальной собственности, охватывающую «всю иную
      интеллектуальную собственность, контролируемую Green Cross, непосредственно
      относящуюся к MGAH22», без необходимости получать предварительное согласие.
      Однако выражение «без ограничения» создало неопределённость в отношении
      точного объёма включаемой интеллектуальной собственности. Позднее Green Cross
      расторгло соглашение в соответствии с пунктом 16.3 в связи с существенным
      нарушением. После расторжения MacroGenics обязано было в соответствии с
      пунктом 6.2 продолжать предоставлять Green Cross «Продукты (включая, без
      ограничения, весь MGAH22)» в течение определённого периода. MacroGenics,
      толкуя выражение «без ограничения» широко и стремясь смягчить возможную
      будущую конкуренцию, предоставило Green Cross дженериковую формулу MGAH22,
      лишённую собственного стабилизирующего агента, разработанного внутри компании
      MacroGenics после соглашения. Этот стабилизирующий агент значительно улучшал
      срок годности и эффективность продукта, но не был прямо упомянут в регулирующих
      условиях. MacroGenics утверждало, что стабилизирующий агент представляет
      собой отдельную интеллектуальную собственность, «не относящуюся непосредственно
      к MGAH22», и поэтому выходит за рамки того, что они обязаны предоставлять
      по соглашению. MacroGenics сообщило о своём соответствии через официальное
      письмо в юридический отдел Green Cross, сославшись на своё толкование условия.
      Green Cross, протестировав поставленный продукт, заявило о несоответствии,
      настаивая на том, что собственный стабилизирующий агент является неотъемлемой
      частью «Продуктов», поскольку он необходим для предусмотренного применения
      и коммерческой жизнеспособности MGAH22.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
