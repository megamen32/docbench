id: ace_0008
benchmark: conformance
ruleset: ace-0008
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 8
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_3] В дополнение к этому и при условии завершения сделки на условиях,
      изложенных ниже, Вам будет предоставлен второй опцион в соответствии с
      Опционным планом, причем такой опцион является одним из следующих: (a)
      опцион на приобретение 44 757 Акций (составляющих приблизительно 0,25%
      выпущенного акционерного капитала Компании на Дату вступления в силу),
      предоставляемый как можно скорее после завершения сделки, одобренной
      Советом директоров, на условиях, включающих первоначальный платёж в размере
      не менее 30 000 000 долларов США и поэтапные платежи по каждому продукту
      downstream в размере не менее 300 000 000 долларов США; либо (b) опцион
      на приобретение 22 378 Акций (составляющих приблизительно 0,125% выпущенного
      акционерного капитала Компании на Дату вступления в силу), предоставляемый
      как можно скорее после завершения сделки, одобренной Советом директоров,
      на условиях, включающих первоначальный платёж в размере 24 000 000 долларов
      США и поэтапные платежи по каждому продукту downstream в размере 240 000
      000 долларов США; либо (c) опцион на приобретение такого количества
      Акций (в диапазоне от 0,125% до 0,25% выпущенного акционерного капитала
      Компании на Дату вступления в силу, определяемого по абсолютному усмотрению
      Совета директоров), предоставляемый как можно скорее после завершения
      сделки, одобренной Советом директоров, на условиях, включающих первоначальный
      платёж в размере более 24 000 000 долларов США, но менее 30 000 000 долларов
      США, и поэтапные платежи по каждому продукту downstream в размере более
      240 000 000 долларов США, но менее 300 000 000 долларов США. | На Дату
      вступления в силу или как можно скорее после неё предполагается предоставить
      Вам опцион в соответствии с Опционным планом на приобретение 107 417 обыкновенных
      акций BTL (далее — «Акции») (составляющих приблизительно 0,6% выпущенного
      акционерного капитала Компании на Дату вступления в силу).


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Компания B вступила в переговоры с Компанией A по финализации сделки, которая
      должна была привести к предоставлению опциона по Опционному плану, как
      подробно описано в условии о Множественно-условном обязательстве. Совет
      директоров одобрил структуру сделки на условиях, включающих первоначальный
      платёж в размере 25 000 000 долларов США и поэтапные платежи по продукту
      downstream в размере 290 000 000 долларов США. Эта сделка подпадала под
      диапазон, указанный в условии (c): первоначальный платёж более 24 000 000
      долларов США, но менее 30 000 000 долларов США, и поэтапные платежи downstream
      более 240 000 000 долларов США, но менее 300 000 000 долларов США. Однако
      вместо того чтобы воспользоваться своим «абсолютным усмотрением» для
      определения количества Акций (в диапазоне от 0,125% до 0,25% выпущенного
      акционерного капитала), Совет директоров принял решение предоставить Компании
      A опцион на 22 378 Акций (0,125% выпущенного акционерного капитала), ссылаясь
      на предпочтение придерживаться нижней границы диапазона для сохранения
      акционерного капитала. Совет директоров обосновал это решение ссылкой
      на условие (b), которое предусматривает то же количество Акций для сделки
      с более низкими финансовыми порогами — 24 000 000 долларов США первоначального
      платежа и 240 000 000 долларов США поэтапных платежей. В официальной документации,
      выданной Компании A, явно указывался опцион на 22 378 Акций, что было
      ниже допустимого диапазона по условию (c). В ответ на возражения Компания
      B утверждала, что предоставление соответствовало их намерению остаться
      консервативными и что пересечение между условиями (b) и (c) допускало
      гибкость в их толковании. Компания A, однако, настаивала, что условие
      требовало от Совета директоров оставаться в диапазоне, определяемом условием
      (c), когда финансовые условия однозначно подпадали под это условие.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
