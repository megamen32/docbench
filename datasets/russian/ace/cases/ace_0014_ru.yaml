  agreement:
    kind: agreement
    title: Сценарий ACE 14
    text: "УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):\n\n[evidence_4] Участник не несёт\
      \ ответственности перед Совместным Предприятием или перед любым другим Участником\
      \ за любую ошибку или заблуждение в суждении, либо за любое действие или бездействие,\
      \ совершённое добросовестно и которое он считал совершаемым в пределах полномочий,\
      \ предоставленных или подразумеваемых настоящим Соглашением или Совместным\
      \ Предприятием.\n\n[evidence_5] Совместное Предприятие вправе приобретать страховку\
      \ от имени любого Участника, работника, агента или иного лица, занятого в коммерческой\
      \ деятельности Совместного Предприятия, от любой ответственности, заявленной\
      \ против них или понесённой ими при осуществлении добросовестной деятельности\
      \ от имени Совместного Предприятия.\n\nСЦЕНАРИЙ НА РАССМОТРЕНИИ:\n\nВ октябре\
      \ Совместное Предприятие (JV), в которое входят Компания A, Компания B и\
      \ Компания C, столкнулось с ситуацией, связанной с Марком — подрядчиком,\
      \ привлечённым для реализации высокорискового проекта. Марк был обвинён в\
      \ халатности после того, как критическая ошибка привела к сбою в операциях.\
      \ Марк утверждал, что его действия входили в его должностные обязанности и\
      \ были совершены добросовестно, и просил JV приобрести ретроактивную страховку\
      \ ответственности для его покрытия. Джейн, главный операционный директор\
      \ (COO) JV, оценила запрос. Однако вместо приобретения специальной страховки\
      \ ответственности для Марка Джейн решила использовать уже имеющийся у JV\
      \ зонтичный полис ответственности, который, по её мнению, был бы достаточен\
      \ для данной ситуации. Её обоснование заключалось в том, что зонтичный\
      \ полис шире и экономичнее, чем приобретение новой страховки.\n\nДля реализации\
      \ этого решения Джейн направила страховому брокеру JV официальное электронное\
      \ письмо с текстом: «Пожалуйста, подтвердите, что наш зонтичный полис распространяется\
      \ на подрядчиков, действующих добросовестно от имени JV в данном инциденте\
      \ с участием Марка. Приобретение новой страховки в настоящее время не требуется».\
      \ Страховой брокер, не знакомый с деталями действий Марка, подтвердил, что\
      \ полис потенциально может применяться. Джейн закрыла вопрос, отметив экономию\
      \ средств во внутренней служебной записке. Однако последующий внутренний\
      \ аудит выявил, что покрытие по зонтичному полису явно исключало независимых\
      \ подрядчиков, если они не были указаны в качестве застрахованных лиц, а Марк\
      \ таковым не являлся.\n\nАудиторы также поставили под сомнение соответствие\
      \ действий Марка критерию «добросовестного» осуществления деятельности.\
      \ Марк применил рискованный, несанкционированный метод для выполнения задачи,\
      \ который, по его утверждению, должен был повысить эффективность, но привёл\
      \ к значительному ущербу. Это вызвало обеспокоенность, что его действия\
      \ могли выходить за рамки «добросовестности», как требуется по условию страхования.\
      \ Джейн защищала своё решение, утверждая, что зонтичный полис был предназначен\
      \ для снижения административной нагрузки, и что искреннее намерение Марка принести\
      \ пользу JV соответствовало стандарту добросовестности, даже если результат\
      \ оказался проблемным."
expected_findings: []
expected_disposition: needs_correction
