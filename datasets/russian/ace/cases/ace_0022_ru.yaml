ruleset: ace-0022
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 22
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_4] ExxonMobil вправе расторгнуть настоящее Соглашение с уведомлением
      за пятнадцать (15) дней в письменной форме без применения штрафов, платежей
      или ущемления прав на заявленные требования и обязательства, в случае
      если FCE подвергается Смене Контроля. | С учётом требований применимого
      законодательства, FCE обязуется уведомить ExxonMobil до или незамедлительно
      после того, как ей станет известно о любой такой Смене Контроля, а если
      предварительное уведомление запрещено применимым законодательством — как
      можно скорее или после того, как такое уведомление перестанет быть запрещённым,
      но в любом случае не позднее одного (1) рабочего дня после любого публичного
      объявления в отношении любой такой передачи активов или Смены Контроля.
      | Независимо от любых иных положений настоящего Соглашения, в случае расторжения
      по настоящему пункту 12.04 ExxonMobil вправе прекратить любые лицензии,
      предоставленные FCE по настоящему Соглашению, которые в ином случае продолжали
      бы действовать после прекращения, с учётом обстоятельств, связанных со Сменой
      Контроля.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Компания A, технологическая фирма, заключает соглашение с Компанией B,
      поставщиком возобновляемой энергии, на условиях, изложенных в условии о
      Множественно-условном обязательстве. Через пять месяцев после начала
      действия соглашения Компания B приобретается более крупным конгломератом,
      что вызывает «Смену Контроля», как она определена в контракте. Юридическая
      команда Компании B узнаёт о приобретении в ходе внутренних обсуждений
      за два дня до того, как конгломерат публично объявляет о сделке. Однако,
      опасаясь возможной ответственности по законам о ценных бумагах за преждевременное
      раскрытие конфиденциальной информации, Компания B решает отложить уведомление
      Компании A. Вместо этого Компания B ждёт один (1) рабочий день после публичного
      объявления, а затем направляет официальное уведомление через приоритетную
      курьерскую службу «на следующее утро» в центральный офис Компании A, полагая,
      что физическая доставка будет более надёжной и юридически защитимой, чем
      электронная почта. Уведомление прибывает на следующее утро, но из-за
      административного затора, вызванного корпоративным выездом, оно не регистрируется
      и не рассматривается в течение четырёх дней. Тем временем Компания A публикует
      заявление о расторжении соглашения, ссылаясь на непредоставление Компанией
      B своевременного уведомления в установленный срок. Компания B утверждает,
      что способ доставки курьером, хотя и с небольшой задержкой, был выбран для
      обеспечения соответствия и снижения рисков, связанных с электронной коммуникацией.
      Компания A настаивает, что уведомление не было доставлено «как можно скорее»
      после публичного объявления, как требует условие, и что задержка существенно
      нарушила соглашение.'
expected_findings: []
expected_disposition: needs_correction
