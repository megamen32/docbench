id: ace_0002
benchmark: conformance
ruleset: ace-0002
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 2
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_10] Лицензиат обязан в срок не позднее [***] ([***]) дней с даты
      вступления в силу расторжения Соглашения (и без каких-либо расходов для Bioeq,
      если настоящее Соглашение расторгнуто Bioeq в соответствии с пунктами 15.2.1,
      15.2.2, 15.2.3, 15.2.4, 15.2.8 или 15.2.9, либо Лицензиатом в соответствии
      с пунктом 15.2.5, либо за счёт Bioeq, если Соглашение расторгнуто Лицензиатом
      в соответствии с пунктами 15.2.1, 15.2.6, 15.2.7 или 15.2.8, в зависимости
      от обстоятельств) передать и уступить Bioeq или её уполномоченному лицу все
      права, правовые основания и интересы Лицензиата в отношении любых и всех
      Заявок на лицензирование биологических продуктов и Разрешений на заявки
      на лицензирование биологических продуктов, контролируемых Лицензиатом в
      отношении Лицензированных продуктов в Области применения и на Территории
      по состоянию на дату вступления в силу такого расторжения, включая любую
      и всю документацию, относящуюся к таким регистрационным досье и Разрешениям
      (при условии, что физическая или электронная передача файлов и документации
      в связи с такой передачей и уступкой прав может быть осуществлена по истечении
      указанного [***] ([***]) дневного срока и не будет считаться нарушением
      Лицензиатом настоящего пункта 15.3.2). | Лицензиат обязан (без каких-либо
      расходов для Bioeq, если настоящее Соглашение расторгнуто Bioeq в соответствии
      с пунктами 15.2.1, 15.2.2, 15.2.3, 15.2.4, 15.2.8 или 15.2.9, либо Лицензиатом
      в соответствии с пунктом 15.2.5, либо за счёт Bioeq, если Соглашение расторгнуто
      Лицензиатом в соответствии с пунктами 15.2.1, 15.2.6, 15.2.7 или 15.2.8,
      в зависимости от обстоятельств) предпринимать Коммерчески Разумные Усилия
      по сотрудничеству с Bioeq или её уполномоченным лицом и оказывать [***]
      разумное содействие и поддержку, чтобы [***] Bioeq или её уполномоченному
      лицу принять на себя Коммерциализацию Лицензированных продуктов в Области
      применения и на Территории в течение [***] с даты вступления в силу такого
      расторжения, в том числе путём: (a) принятия Коммерчески Разумных Усилий
      для предоставления [***]; (b) раскрытия и уступки (в той мере, в какой это
      разрешено соответствующим соглашением) Bioeq действующих договоров Лицензиата,
      относящихся исключительно к Коммерциализации Лицензированного продукта на
      Территории, в том числе с [***], в максимально разрешённой законом степени
      ([***]); и (c) передачи маркетинговых материалов, относящихся исключительно
      к Лицензированному продукту, в том числе [***]. | Лицензиату разрешается,
      по выбору Bioeq (если настоящее Соглашение расторгнуто Bioeq в соответствии
      с пунктами 15.2.1, 15.2.2, 15.2.3, 15.2.4, 15.2.8 или 15.2.9, либо Лицензиатом
      в соответствии с пунктом 15.2.5) или по выбору Лицензиата (если Соглашение
      расторгнуто Лицензиатом в соответствии с пунктами 15.2.1, 15.2.6, 15.2.7
      или 15.2.8): (a) продолжать продавать имеющиеся у него и его Аффилированных
      лиц остатки Лицензированных продуктов по состоянию на дату вступления в
      силу расторжения в соответствии с настоящим Соглашением в течение максимум
      [***] ([***]) дней (в этом случае все условия настоящего Соглашения, включая
      обязанность Лицензиата отчитываться и уплачивать роялти, продолжают применяться
      к такой продолжающейся продаже); либо (b) продать такие остатки Bioeq по
      цене поставки, уплаченной Лицензиатом Bioeq за такие остатки в соответствии
      с Соглашением о производстве и поставке.


      [evidence_3] Лицензиат обязан уведомить Bioeq в письменной форме в течение
      [***] ([***]) дней после заключения Лицензиатом окончательного соглашения,
      которое приведёт к Смене Контроля со стороны Конкурента. | Bioeq вправе немедленно
      расторгнуть настоящее Соглашение путём письменного уведомления Лицензиата,
      если Лицензиат осуществляет любую клиническую разработку, маркетинг, продажу
      или распространение любого Конкурирующего продукта на Территории, прямо
      либо косвенно через посредство Третьего лица или своих Аффилированных лиц
      (Ограниченные виды деятельности); при условии, что в случае, если Ограниченные
      виды деятельности осуществляются или будут считаться осуществляемыми Лицензиатом
      исключительно в связи со Сменой Контроля со стороны Конкурента, Bioeq не
      вправе расторгнуть настоящее Соглашение в соответствии с настоящим пунктом
      15.2.2 и вместо этого вправе расторгнуть настоящее Соглашение в соответствии
      с пунктом 15.2.9. | После завершения такого окончательного соглашения, если
      Лицензиат к тому моменту не избавился от всех таких Конкурирующих продуктов
      таким образом, что Смена Контроля со стороны Конкурента фактически произошла,
      Bioeq вправе, направив Лицензиату письменное уведомление в течение последующих
      шестидесяти (60) дней, расторгнуть настоящее Соглашение.


      [evidence_4] За исключением случаев, прямо предусмотренных настоящим Соглашением,
      ни одна из Сторон не вправе уступать или иным образом передавать настоящее
      Соглашение либо какое-либо право или обязательство по нему (добровольно,
      в силу закона или иным образом) без предварительного явного письменного согласия
      другой Стороны; однако, любая из Сторон вправе осуществить такую уступку
      или передачу без согласия другой Стороны: (a) любому из своих Аффилированных
      лиц; либо (b) в связи с продажей всех или почти всех своих активов, к которым
      относится настоящее Соглашение, независимо от формы — слияние, приобретение,
      продажа активов, покупка акций или иное, — но в любом случае с учётом права
      Bioeq расторгнуть настоящее Соглашение в соответствии с пунктом 15.2.9 (во
      избежание сомнений, такое право расторжения в соответствии с пунктом 15.2.9
      применяется mutatis mutandis в случае уступки Соглашения Конкуренту во всех
      случаях, перечисленных в подпункте (b) выше). | Лицензиат вправе свободно
      привлекать субподрядчиков или делегировать исполнение любых своих прав или
      обязательств по настоящему Соглашению своим Аффилированным лицам или Третьим
      лицам при условии, что: (i) все продажи Лицензированных продуктов в Области
      применения и на Территории по-прежнему осуществляются Лицензиатом или его
      Аффилированными лицами (либо их оптовыми продавцами или дистрибьюторами);
      и (ii) Лицензиат остаётся ответственным за исполнение своих обязательств
      по настоящему Соглашению. | Любая предполагаемая уступка или передача в нарушение
      настоящего пункта 16.4 является ничтожной.


      [evidence_7] В соответствии с условиями настоящего Соглашения Bioeq настоящим
      предоставляет Лицензиату исключительную (в том числе в отношении самой
      Bioeq), обусловленную контрольными точками и роялти, непередаваемую лицензию
      (включая право на выдачу сублицензий лишь в объёме, разрешённом пунктом
      2.1.2) на использование Лицензионной технологии (включая Лицензионные патенты)
      в целях использования, продажи, организации продажи, импорта, организации
      импорта или иной Коммерциализации Лицензированных продуктов в Области применения
      и на Территории. | Исключительно в случае расторжения настоящего Соглашения
      Bioeq в соответствии с пунктами 15.2.1, 15.2.2, 15.2.3, 15.2.4, 15.2.8 или
      15.2.9 либо Лицензиатом в соответствии с пунктом 15.2.5, Лицензиат обязан
      предоставить и настоящим предоставляет Bioeq исключительную, безвозмездную,
      полностью оплаченную, сублицензируемую лицензию на использование Контролируемых
      Лицензиатом Товарных знаков, фактически использовавшихся Лицензиатом для
      Коммерциализации Лицензированных продуктов на Территории в связи с Коммерциализацией
      Bioeq Лицензированных продуктов на Территории. | В тех странах, где для
      совместного правообладателя Совместного изобретения или Совместного улучшения
      требуется специальная лицензия для использования такого Совместного изобретения
      или Совместного улучшения, в такой стране каждая Сторона настоящим предоставляет
      другой Стороне бессрочную, безотзывную, неисключительную, всемирную, безвозмездную,
      полностью оплаченную лицензию, передаваемую и сублицензируемую, в пределах
      прав, правовых оснований и интересов такой Стороны в отношении такого Совместного
      изобретения или Совместного улучшения, на свободное использование такого
      Совместного изобретения или Совместного улучшения в такой стране в соответствии
      с условиями настоящего Соглашения и предоставленными по нему лицензиями.
      | (в течение срока действия настоящего Соглашения и, с учётом пункта 15.3.4,
      после расторжения или истечения срока действия настоящего Соглашения) неисключительную,
      полностью оплаченную, безотзывную лицензию (включая право на выдачу сублицензий)
      в отношении всех Прав интеллектуальной собственности и Ноу-хау, контролируемых
      Лицензиатом и закреплённых в Улучшениях Лицензиата, заявляемых в их отношении
      или охватывающих их, на Разработку, Производство, продажу, импорт или иную
      Коммерциализацию Лицензированных продуктов за пределами Территории. | Лицензиат
      настоящим предоставляет Bioeq в течение срока действия настоящего Соглашения
      (и, с учётом пункта 15.3.4, после расторжения или истечения срока действия
      настоящего Соглашения).


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Bioeq заключила соглашение о слиянии с Конкурентом, что привело к Смене
      Контроля со стороны Конкурента, как она определена в пункте 15.2.2. Лицензиат,
      полагая, что он соблюдает требование об уведомлении, направил письменное
      уведомление в установленный срок. Однако вместо того чтобы направить уведомление
      непосредственно назначенному представителю Bioeq по юридическим вопросам,
      как это предусмотрено соглашением, Лицензиат направил уведомление на общий
      адрес электронной почты клиентской службы Bioeq с темой «Общее обновление:
      изменение корпоративной структуры». Электронное письмо содержало подробное
      описание соглашения о слиянии и его влияния на договорные отношения, однако
      оно было включено в более широкое сообщение о текущих оперативных обновлениях.
      В него также входили обновления по не связанным запускам продуктов, маркетинговым
      планам и незначительным изменениям договоров, что затрудняло выявление
      этого уведомления как формального уведомления, требуемого соглашением.
      Параллельно Лицензиат продолжил клиническую разработку Конкурирующих продуктов
      в рамках совместного предприятия (JV) с Третьим лицом. Лицензиат утверждал,
      что эта деятельность JV осуществлялась исключительно «в связи» со Сменой
      Контроля со стороны Конкурента, что должно было бы воспрепятствовать немедленному
      расторжению в соответствии с пунктом 15.2.2 и вместо этого перенести право
      расторжения в пункт 15.2.9. Однако Bioeq оспаривала это, указывая, что
      механизм JV нарушает пункт 16.4, запрещающий передачу прав или обязательств
      Третьим лицам без предварительного письменного согласия. Лицензиат обосновывал
      JV тем, что такая договорённость являлась не передачей, а субподрядом, допускаемым
      соглашением. Дополнительно Лицензиат заявлял, что даже если бы предварительное
      согласие требовалось, Смена Контроля со стороны Конкурента освобождала эти
      виды деятельности в силу регулирующих положений.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
