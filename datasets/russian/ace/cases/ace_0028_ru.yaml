id: ace_0028
benchmark: conformance
ruleset: ace-0028
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 28
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_1] При условии, что COMWARE приобретает в течение Начального Периода
      Дистрибуции Продукты в любой комбинации на общую сумму не менее 45 420,00
      долларов США, настоящее Соглашение автоматически продлевается на дополнительные
      6 месяцев (далее — «Период Продления»).


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      COMWARE, дистрибьютор, заключил с поставщиком соглашение, которое предусматривало
      автоматическое продление контракта на дополнительные 6 месяцев, если COMWARE
      приобретёт Продукты на сумму не менее 45 420 долларов США в течение Начального
      Периода Дистрибуции. По мере приближения срока COMWARE разместил крупный
      заказ на покупку Продуктов на сумму 50 000 долларов США. Однако заказ
      включал оговорку: 10 000 долларов США от покупки были отнесены к отложенным
      продуктам, которые будут отгружены и выставлены в счёт только после окончания
      Начального Периода Дистрибуции. COMWARE обосновал эту договорённость тем,
      что поставщик предложил скидки на эти конкретные продукты, что делало их
      экономически выгодными для будущей перепродажи. Оставшиеся Продукты на сумму
      40 000 долларов США были поставлены и оприходованы до истечения срока.
      COMWARE ссылался на пункт 3.2 соглашения, в котором было сказано, что в
      общую сумму покупки могут включаться Продукты «в любой комбинации», утверждая,
      что отложенные товары всё равно квалифицируются как часть обязательства
      по покупке, поскольку они были размещены в качестве юридически обязывающих
      заказов до истечения срока. Система поставщика подтвердила, что общая стоимость
      заказа превысила 45 420 долларов США, но только 40 000 долларов США были
      признаны выставленным доходом в пределах Начального Периода Дистрибуции.
      После окончания периода поставщик оспорил продление, утверждая, что отложенные
      товары не могут быть засчитаны, поскольку они не были выставлены и поставлены
      в течение указанного срока, а фактическая квалифицированная сумма покупки
      не достигла порога.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
