id: ace_0011
benchmark: conformance
ruleset: ace-0011
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 11
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_2] Подлежит страхованию Продавцом на сумму 110% стоимости контракта
      от всех рисков и военных рисков.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Продавец обязан обеспечить страховое покрытие на сумму 110% стоимости контракта
      от всех рисков и военных рисков в соответствии с условиями договора. Продавец
      организует такое покрытие, но использует два отдельных страховых полиса:
      один для покрытия всех рисков на сумму 110% стоимости контракта и другой
      для покрытия военных рисков лишь на сумму 100% стоимости контракта. Продавец
      сообщает об этой договорённости необычным способом — комментарием, приложенным
      к счёт-фактуре в общем облачном хранилище, а не путём формального письменного
      уведомления. Этот комментарий впоследствии удаляется, но страховые полисы
      остаются действительными и доступными для проверки. Дополнительно, Продавец
      не даёт никаких активных разъяснений относительно раздельных полисов, что
      приводит к первоначальному предположению Покупателя о том, что Продавец
      не выполнил требование контракта о полном страховом покрытии. При более
      тщательной проверке совокупное покрытие по двум полисам удовлетворяет
      требуемой сумме в 110% стоимости контракта, а разделение рисков по разным
      полисам не запрещено формулировками контракта. Тем не менее, необычный
      способ коммуникации и отсутствие ясности в отношении раздельных полисов
      создают видимость несоблюдения требований контракта при первом рассмотрении.'
expected_findings: []
expected_disposition: accept
