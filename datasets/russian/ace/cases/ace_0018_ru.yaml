ruleset: ace-0018
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 18
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_4] привлекать любых Клиентов, имеющих коммерческое присутствие за
      пределами Территории, за исключением того, что Дистрибьютор не вправе осуществлять
      деятельность по привлечению на любой внешней территории, где Hydraspin
      связана эксклюзивным дистрибьюторским соглашением с третьим лицом, при
      условии, что Hydraspin уведомила Дистрибьютора в письменной форме о своих
      договорённостях с другим дистрибьютором и о территории, в отношении которой
      действует исключительное право в пользу другого дистрибьютора. | Дистрибьютор
      вправе рекламировать, продвигать, маркетировать или


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      В январе 2023 года Компания A, дистрибьютор Hydraspin, запустила масштабную
      маркетинговую кампанию, ориентированную на компании в Регионе Y за пределами
      своей назначенной территории. Эта кампания включала email-рассылку, веб-баннеры
      и виртуальный вебинар с демонстрацией продуктов Hydraspin. Регион Y включал
      несколько субрегионов, в одном из которых находилась Компания Z — бизнес,
      расположенный на эксклюзивной территории, охватываемой соглашением Hydraspin
      со сторонним дистрибьютором, Компанией C. Hydraspin направило Компании A
      уведомление по электронной почте 15 декабря 2022 года, информируя её об
      эксклюзивной договорённости с Компанией C. Однако это письмо было лишено
      конкретики — в нём расплывчато упоминался «Регион Y» без указания субрегионов,
      подпадающих под исключительное право. Дополнительно, письмо не содержало
      официального бланка компании и не было помечено как юридически обязывающее
      уведомление. Полагая, что письмо не имеет формальной силы, Компания A
      провела виртуальный вебинар, пригласив компании из всех субрегионов Региона
      Y, включая Компанию Z. Материалы вебинара не были конкретно адресованы
      Компании Z, но содержали общий маркетинговый контент, доступный всем участникам.
      После вебинара Компания Z выразила заинтересованность в продуктах Hydraspin
      и инициировала контакт с Компанией A для получения дополнительной информации.
      Узнав об этом, Компания C обвинила Компанию A в нарушении условия об исключительном
      праве, заключающемся в косвенном привлечении компаний на её эксклюзивной
      территории посредством вебинара. Компания A защищала свои действия, утверждая,
      что отсутствие чётких географических границ в письме Hydraspin делало невозможным
      определение того, какие субрегионы являются закрытыми, и что вебинар являлся
      общей маркетинговой инициативой, не направленной на конкретные компании.'
expected_findings: []
expected_disposition: needs_correction
gold_scope: disposition
notes: 'Метка источника ACE: Не соответствует'
