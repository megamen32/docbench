id: ace_0015
benchmark: conformance
ruleset: ace-0015
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 15
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_5] Для большей определённости, «Новая Технология» не включает
      любое: (x) изменение предсуществующих Прав интеллектуальной собственности
      Philips (которые, в свою очередь, исключают любые Права интеллектуальной
      собственности, входящие в «Приобретённые Активы» по Договору купли-продажи),
      и (y) разработки, выполненные не для Продуктов (совместно именуемые «Сохраняемая
      Интеллектуальная Собственность Philips на Продукт»), при условии, что
      Philips и её Аффилированные лица настоящим предоставляют Заказчику в
      рамках любых таких Прав интеллектуальной собственности, применимых или
      используемых для производства Продукта, неисключительную, непередаваемую
      (за исключением случаев, предусмотренных пунктом 18.4 (Уступка)), безотзывную,
      всемирную, полностью оплаченную лицензию без права выдачи сублицензий
      на производство, организацию производства, продажу или иную коммерциализацию
      Продукта. | Заказчик предоставляет Philips в течение Срока неисключительное,
      безвозмездное, непередаваемое право на производство, организацию производства,
      использование, продажу, воспроизведение, адаптацию, распространение или
      иное использование Прав интеллектуальной собственности Заказчика исключительно
      в связи с производством Продуктов и упаковки для Заказчика в соответствии
      с настоящим Соглашением.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Philips, в рамках производственного соглашения с Заказчиком, обязано предоставить
      неисключительную, непередаваемую, безотзывную, всемирную, полностью оплаченную
      лицензию на любые Права интеллектуальной собственности (ИПС), используемые
      в производстве Продукта. В данном случае Philips разработало уникальное
      усовершенствование производственного процесса, использующее собственный
      алгоритм, принадлежащий одному из его Аффилированных лиц. Признавая своё
      обязательство по соглашению, Philips направило Заказчику официальное уведомление
      о том, что Заказчику предоставлена лицензия на использование алгоритма
      для производства Продукта. Однако вместо того чтобы направить уведомление
      через стандартные каналы, предусмотренные соглашением (например, посредством
      заверенной письменной коммуникации), Philips сообщило об этом через общую
      платформу управления проектами, используемую для повседневных задач, отметив
      руководителя проекта Заказчика в соответствующей ветке сообщений. Уведомление
      было помечено платформой как «архивированное» через 24 часа и не было
      сразу видно без поиска в истории ветки. Дополнительно, Philips включило
      в сообщение оговорку о том, что алгоритм остаётся частью «Сохраняемой Интеллектуальной
      Собственности Philips на Продукт» и не может быть сублицензирован или
      использован для целей, не связанных с Продуктом. Эта оговорка, хотя и была
      точной в соответствии с соглашением, вызвала путаницу в команде Заказчика,
      поскольку, казалось, ставила под сомнение фактическое предоставление лицензии.
      Несмотря на эти опасения, Philips не сделало дополнительных разъяснений,
      полагаясь на то, что Заказчик сам интерпретирует сообщение на общей платформе
      и оговорку как надлежащее уведомление о предоставлении лицензии. Впоследствии
      Заказчик выразил опасения, утверждая, что Philips не предоставило лицензию
      надлежащим образом, и поставил под сомнение действительность использованного
      способа коммуникации.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
