id: ace_0017
benchmark: conformance
ruleset: ace-0017
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 17
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_6] Nantz соглашается быть доступным для проведения до четырёх
      фотосессий (2 в Южной Калифорнии в течение недели и 2 в местах расположения
      или на турнирах Nantz), двух публичных выступлений и трёх появлений в
      магазинах в течение каждого Года Действия Договора, в согласованные между
      Nantz и Компанией время и места, но ни в коем случае не во время, неблагоприятно
      влияющее на расписание Nantz Communications или Nantz. | Компания соглашается,
      что каждая фотосессия не должна превышать полутора дней, а каждое публичное
      выступление и появление в магазине не должно превышать полудня.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Nantz заключает контракт на выполнение обязательств, изложенных в условии
      о Множественно-условном обязательстве, включая до четырёх фотосессий, два
      публичных выступления и три появления в магазинах в течение каждого Года
      Действия Договора. В одном Году Действия Договора Nantz планирует две
      фотосессии в своей резиденции в Южной Калифоррии в будние дни, одно публичное
      выступление на конференции в середине недели и одно появление в магазине
      в субботу утром. Однако для второй фотосессии в «месте расположения»
      Nantz предлагает провести её виртуально с помощью высококачественной прямой
      трансляции, ссылаясь на логистические трудности и взаимоприемлемый характер
      такой договорённости. Компания, после некоторого обсуждения, соглашается
      на это условно, при условии, что результат соответствует их стандартам
      качества. Nantz выполняет все сессии и выступления, как предусмотрено соглашением,
      однако Компания получает возражения от одного из партнёров магазина, утверждающего,
      что виртуальная фотосессия была «непрофессиональной» и «не соответствовала
      духу контракта». Ситуация дополнительно осложняется тем, что сообщение
      Nantz о виртуальной сессии было сделано в форме неформального замечания
      во время Zoom-звонка, которое изначально не было задокументировано в официальной
      переписке. Несмотря на это, виртуальная сессия удовлетворяет договорным
      ограничениям по времени (не превышает полутора дней) и не вступает в противоречие
      с расписанием Nantz или Nantz Communications. Все события происходят в
      пределах Года Действия Договора, и Nantz выполняет согласованное количество
      обязательств.'
expected_findings: []
expected_disposition: accept
