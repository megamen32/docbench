id: ace_0009
benchmark: conformance
ruleset: ace-0009
documents:
  agreement:
    kind: agreement
    title: Сценарий ACE 9
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_2] Настоящее Соглашение подлежит автоматическому продлению на
      последовательные периоды продолжительностью один (1) год, если ни одна
      из сторон не направит письменное уведомление, не менее чем за девяносто
      (90) дней до даты годовщины, о том, что продление Соглашения не требуется.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Компания A и Компания B являются сторонами сервисного соглашения, которое
      включает условие об автоматическом продлении. Контракт предусматривает,
      что соглашение продлевается на последовательные однолетние сроки, если
      «ни одна из сторон не направит письменное уведомление, не менее чем за
      девяносто (90) дней до даты годовщины, о том, что продление Соглашения
      не требуется». 2 мая Компания A принимает решение не продлевать контракт,
      при этом дата годовщины приходится на 1 августа. Для соблюдения условия
      Компания A составляет официальное письмо с просьбой о непродлении и
      направляет его заказным письмом на официальный адрес Компании B 3 мая.
      Однако получение заказного письма задерживается, и письмо физически прибывает
      в офис Компании B только 9 мая. Отдельно от этого, 4 мая сотрудник Компании
      A, не зная об официальном письме, направляет своему коллеге в Компании
      B неформальное электронное письмо с текстом: «Привет, просто к сведению,
      не планирую продлевать эту штуку. Дай знать, если хочешь обсудить». Это
      письмо отправлено с личного мобильного устройства сотрудника, с использованием
      его личной электронной почты, и не содержит официального бланка или договорной
      формулировки. 1 августа Компания B заявляет, что контракт был автоматически
      продлён, утверждая, что Компания A не выполнила надлежащим образом требование
      о письменном уведомлении, поскольку официальное письмо прибыло с задержкой,
      а электронное письмо не было достаточно формальным для признания его надлежащим
      письменным уведомлением.'
expected_findings: []
expected_disposition: accept
gold_scope: disposition
notes: 'Метка источника ACE: Соответствует'
