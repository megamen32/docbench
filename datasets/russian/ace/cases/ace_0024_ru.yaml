  agreement:
    kind: agreement
    title: Сценарий ACE 24
    text: 'УСЛОВИЯ СОГЛАШЕНИЯ (регулирующие правила):

      [evidence_3] 1. Для целей настоящего Соглашения «Информация» означает конфиденциальные
      или охраняемые коммуникации или данные любой из Сторон настоящего Соглашения,
      включая коммерческую информацию, финансовую информацию, маркетинговые планы.
      | техническую или финансовую информацию, списки клиентов или предложения,
      эскизы, модели, образцы, компьютерные программы и документацию, чертежи,
      спецификации, вне зависимости от того, передаются ли они в устной, письменной,
      графической или электромагнитной форме или иным образом, а также все заметки,
      аналитические материалы, подборки, прогнозы, исследования, интерпретации
      или иные документы, подготовленные любой из Сторон, в той мере, в какой они
      содержат любую такую информацию.


      [evidence_7] 1. Для целей настоящего Соглашения «Информация» означает конфиденциальные
      или охраняемые коммуникации или данные любой из Сторон настоящего Соглашения,
      включая коммерческую информацию, финансовую информацию, маркетинговые планы.
      | техническую или финансовую информацию, списки клиентов или предложения,
      эскизы, модели, образцы, компьютерные программы и документацию, чертежи,
      спецификации, вне зависимости от того, передаются ли они в устной, письменной,
      графической или электромагнитной форме или иным образом, а также все заметки,
      аналитические материалы, подборки, прогнозы, исследования, интерпретации
      или иные документы, подготовленные любой из Сторон, в той мере, в какой они
      содержат любую такую информацию.


      СЦЕНАРИЙ НА РАССМОТРЕНИИ:

      Компания A и Компания B заключают Соглашение о неразглашении (NDA), которое
      определяет «Информацию» как конфиденциальные или охраняемые данные, включая
      аналитические материалы или документы, подготовленные любой из сторон, «в
      той мере», в которой они содержат такую информацию. В ходе своего сотрудничества
      Компания A передаёт Компании B детальный финансовый прогноз, помеченный как
      «Конфиденциально». Компания B впоследствии готовит внутренний отчёт с обзором
      отраслевых тенденций, в который включает несколько точек данных из прогноза
      Компании A. Отчёт распространяется внутри Компании B и впоследствии используется
      как основа для презентации на отраслевой конференции. В этой презентации
      старший аналитик Компании B включает слайд с агрегированными визуализациями
      данных, которые косвенно отражают собственные финансовые показатели Компании
      A. Визуализации представлены как обобщённые отраслевые ориентиры без явного
      указания на Компанию A. Компания A обвиняет Компанию B в нарушении NDA,
      утверждая, что внутренний отчёт и публичная презентация нарушили обязательства
      о конфиденциальности. Компания B защищает свои действия, утверждая, что
      визуализации были агрегированными выводами, полученными из нескольких источников,
      включая общедоступные данные, и не достигали порога «в той мере» того, что
      они содержали конфиденциальную информацию Компании A. Компания B далее утверждает,
      что презентация была предназначена для демонстрации отраслевых тенденций
      и не раскрывала никаких конкретных собственных данных Компании A.'
expected_findings: []
