      SCENARIO UNDER REVIEW:

      Party A, a biotechnology company, is engaged in a complex R&D Work Plan with
      Party B, a pharmaceutical corporation, under a multi-layered agreement. To accelerate
      its research timeline, Party A decides to engage an Agent (a specialized research
      contractor) to develop new molecular compounds. Recognizing the contractual
      requirement for prior written agreements, Party A drafts a contract with the
      Agent that includes provisions for (i) assigning all Inventions created by the
      Agent to Party A, and (ii) maintaining all Confidential Information in confidence.
      However, instead of obtaining Party B''s prior written consent or providing
      explicit advance notice of the Agent’s engagement, Party A chooses to rely on
      a broadly-worded clause from a separate section of the agreement allowing ''routine
      activities involving approved Third Parties'' without formal notice. Party A
      interprets this clause as implicitly covering the Agent’s engagement, arguing
      that the Agent’s activities are routine and fall within the scope of the R&D
      Work Plan. Party A proceeds to finalize the contract with the Agent and begins
      the research activities, assuming compliance based on this interpretation. Weeks
      later, Party B discovers the engagement during a routine project review and
      raises concerns about the lack of formal notice and consent, citing Section
      10.2’s explicit requirements for assignments and Third Party engagements. Party
      A defends its actions, insisting that the Agent’s activities were routine and
      therefore exempt from the stricter procedural requirements under Section 10.2.
      Party B counters that the governing clause explicitly requires prior written
      agreements and notice for any Third Party involvement tied to the R&D Work Plan,
      and that reliance on a separate clause does not override this obligation.'
