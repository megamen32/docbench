      SCENARIO UNDER REVIEW:

      Bioeq entered into a merger agreement with a Competitor, leading to a Competitor
      Change of Control as defined under Section 15.2.2. Licensee, believing it was
      adhering to the notice requirement, sent a written notification within the required
      timeframe. However, instead of sending the notice directly to Bioeq’s designated
      legal representative as specified in the agreement, Licensee sent the notice
      to Bioeq’s general customer service email address with the subject line ''General
      Update: Change in Corporate Structure.'' The email contained a detailed explanation
      of the merger agreement and its impact on the contractual relationship but was
      buried within a broader message discussing routine operational updates. This
      included updates on unrelated product launches, marketing plans, and minor contractual
      amendments, making the notice difficult to identify as the formal notification
      required under the agreement. Separately, the Licensee continued clinical development
      of Competitive Products through a joint venture (JV) arrangement with a Third
      Party. Licensee argued that this JV activity was conducted solely ''in connection
      with'' the Competitor Change of Control, which would prevent immediate termination
      under Section 15.2.2 and instead redirect termination rights to Section 15.2.9.
      However, Bioeq contested that the JV arrangement violated Section 16.4, which
      prohibits transfers of rights or obligations to Third Parties without prior
      written consent. Licensee justified the JV by asserting that the arrangement
      was not a transfer but rather a subcontracting activity permissible under the
      agreement. Additionally, Licensee claimed that even if prior consent was required,
      the Competitor Change of Control exempted these activities under the governing
      provisions.'
