      SCENARIO UNDER REVIEW:

      Green Cross and MacroGenics were collaborating under a licensing agreement for
      the development and commercialization of a pharmaceutical product, MGAH22. Under
      the agreement, Green Cross granted MacroGenics a royalty-free, worldwide license
      to use Green Cross'' intellectual property, encompassing ''all other intellectual
      property Controlled by Green Cross that is specifically related to MGAH22,''
      without the need to obtain prior consent. However, the term ''without limitation''
      created ambiguity regarding the exact scope of the intellectual property included.
      Later, Green Cross terminated the agreement pursuant to Section 16.3 due to
      a material breach. Following the termination, MacroGenics was obligated under
      Section 6.2 to continue providing Green Cross with ''the Products (including,
      without limitation, all MGAH22)'' for a specified period. MacroGenics, interpreting
      ''without limitation'' broadly and desiring to mitigate potential future competition,
      provided Green Cross with a generic formulation of MGAH22 lacking a proprietary
      stabilizing agent developed in-house by MacroGenics post-agreement. This stabilizing
      agent significantly improved the product''s shelf life and efficacy but was
      not explicitly referenced in the governing clauses. MacroGenics argued that
      the stabilizing agent constituted a separate intellectual property not ''specifically
      related to MGAH22'' and therefore was outside the scope of what they were required
      to provide under the agreement. MacroGenics communicated their compliance through
      a formal letter, citing their interpretation of the clause, which was delivered
      to Green Cross'' legal department. Green Cross, upon testing the delivered product,
      alleged non-compliance, maintaining that the proprietary stabilizing agent was
      integral to the ''Products'' as it was essential for MGAH22''s intended use
      and commercial viability.'
