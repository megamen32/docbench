      [evidence_15] Such notice shall include written confirmation and details of
      replacement insurance coverages and other material revisions to the policies,
      which shall be effective immediately upon any cancellation or material change
      in EFS'' policies in order that no gap in coverage results. | EFS agrees that
      these policies shall not be canceled or materially changed without at least
      thirty (30) days'' prior written notice to Client. | EFS shall maintain at all
      times during the Term of this Agreement insurance as provided below and shall
      name Client, its parent company, subsidiaries and affiliated entities and their
      respective officers, directors, shareholders, agents and employees as additional
      insureds to the extent of indemnity provided herein under its liability policies
      as follows: (i) Commercial general liability insurance including premises/operations,
      broad form property damage, independent contractors, and contractual liability
      covering EFS'' obligations hereunder for bodily injury and property damage,
      with a combined single limit of not less than $1,000,000 each occurrence and
      $6,000,000 umbrella coverage; (ii) Workers'' compensation insurance in statutory
      amounts covering EFS and its employees; and (iii) Errors and omissions insurance,
      and employer''s liability insurance in an amount not less than $1,000,000 per
      accident/disease. | of no less than A-. | All insurance required above shall
      be carried with insurance companies licensed to do business in the state(s)
      where operations are maintained with a rating | EFS shall deliver to Client,
      upon execution of the Agreement, certificates of insurance as evidence of the
      required coverages.


      SCENARIO UNDER REVIEW:

      EFS, under the terms of its agreement with Client, was obligated to maintain
      various insurance policies and provide certificates of insurance as evidence
      of coverage upon execution of the Agreement and at all times during the Term.
      Midway through the Term, EFS faced a situation where its commercial general
      liability insurance policy was set to expire due to the insurer discontinuing
      operations in the relevant jurisdiction. EFS secured a new policy that met the
      specified terms, including coverage limits and naming Client as an additional
      insured ''to the extent of indemnity provided herein.'' However, instead of
      providing a formal certificate of insurance upon policy execution, EFS supplied
      a detailed coverage summary from the insurance broker, which included policy
      limits, covered entities, and the effective dates. EFS reasoned that the coverage
      summary was sufficient to demonstrate compliance, as it contained all relevant
      details required for Client to verify the policy''s validity. Additionally,
      EFS argued that obtaining a formal certificate of insurance would cause unnecessary
      delays in business operations, as the insurer required additional administrative
      processing time for certificate issuance. Simultaneously, EFS assured Client
      that the certificate would follow within two weeks, after the insurer completed
      its internal formalities. While the policy itself was active and there was no
      gap in coverage, Client’s compliance officer raised concerns that the governing
      clauses explicitly required ''certificates of insurance'' as evidence of coverage
      and that any alternative documentation was insufficient. Despite EFS’s efforts
      to expedite the certificate delivery, it was ultimately issued and provided
      to Client 12 days after the new policy became effective, leaving a critical
      gap in formal evidence during the interim period.'
